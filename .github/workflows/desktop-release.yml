name: Desktop release (signed DMG)

# Builds MyPlow.app, signs it with the Plow Developer ID, notarizes it and uploads the DMG.
#
# The certificate and notary login are the SAME ones Plow Latch ships with (1Password item
# "Domo signing (mirrored from terraform)"), stored as this repo's own secrets: APPLE_CERTIFICATE,
# APPLE_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_PASSWORD. Not a 1Password service-account token: the
# only one agents hold reads every agent credential, and CI needs just these four.
#
# Tauri signs and notarizes the .app itself from APPLE_CERTIFICATE / APPLE_SIGNING_IDENTITY /
# APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID. bundle-runtime.sh signs the carried binaries
# with the same identity first, because notarization rejects the DMG over any unsigned
# Mach-O nested in Resources.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to build, e.g. v5.22.170. The workflow comes from the branch it is run on, so a runner change reaches an older tag."
        required: false

permissions:
  contents: read

jobs:
  dmg:
    # arm64: the carried binaries are built for the runner's arch. GitHub stopped serving macos-14 on 2026-11-05 (runs cancelled in 3 s,
    # "macos-14-arm64-us-default is not supported"); its list then had macos-15 and macos-26 for arm64.
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: 3559PD337Z
      # The oldest macOS the app runs on: 169's. Homebrew keeps no bottles for it, so what the app carries is built here for it.
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # A tag older than these build scripts builds with the ones beside this workflow; the app and its runtime stay the tag's.
      - name: Build scripts from this workflow's commit
        if: inputs.ref != ''
        run: git fetch --depth 1 origin ${{ github.sha }} && git checkout FETCH_HEAD -- desktop/scripts

      # Build-machine only: the binaries are copied out of Homebrew and vendored into the app.
      # Nothing here is needed on the machine that installs the DMG.
      - name: Tools to vendor
        run: |
          brew install cmake pkgconf
          curl -LsSf https://astral.sh/uv/install.sh | sh
          ~/.local/bin/uv python install 3.13
          cargo install tauri-cli --version "^2" --locked

      - name: Import the certificate so bundle-runtime.sh can sign with it
        run: |
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm "$RUNNER_TEMP/cert.p12"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application[^"]*"' | head -1 | tr -d '"')
          [ -n "$IDENTITY" ] || { echo "no Developer ID Application identity in the certificate" >&2; exit 1; }
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build what the app carries for macOS 14
        run: |
          desktop/scripts/build-floor.sh "$RUNNER_TEMP/floor"
          echo "$RUNNER_TEMP/floor/bin" >> "$GITHUB_PATH"
          echo "DEPS=$RUNNER_TEMP/floor" >> "$GITHUB_ENV"

      - name: Bundle the runtime
        run: PYTHON_SRC="$(~/.local/bin/uv python find 3.13 | xargs dirname | xargs dirname)" desktop/scripts/bundle-runtime.sh

      # The carried tmux and ttyd come from Homebrew bottles built for the runner's macOS, so they need that macOS or newer: a newer
      # runner raises it. The app says so as its own minimum, so an older Mac refuses to open it instead of opening one that cannot run.
      - name: The oldest macOS the carried binaries run on
        run: |
          MIN=$(find desktop/src-tauri/runtime -type f \( -perm -u+x -o -name '*.dylib' -o -name '*.so' \) -print0 |
                xargs -0 -n 1 vtool -show-build 2>/dev/null | awk '/minos/{print $2}' | sort -V | tail -1)
          [ -n "$MIN" ] || { echo "no minos read from the carried binaries" >&2; exit 1; }
          echo "carried binaries need macOS $MIN or newer"
          # Never above the floor: a Mac that ran 169 must run this.
          [ "$(printf '%s\n%s\n' "$MIN" "$MACOSX_DEPLOYMENT_TARGET" | sort -V | tail -1)" = "$MACOSX_DEPLOYMENT_TARGET" ] || {
            find desktop/src-tauri/runtime -type f \( -perm -u+x -o -name '*.dylib' -o -name '*.so' \) -print0 |
              xargs -0 -n 1 sh -c 'v=$(vtool -show-build "$0" 2>/dev/null | awk "/minos/{print \$2}"); [ -n "$v" ] && echo "$v $0"' | sort -V | tail -5 >&2
            echo "carried binaries need macOS $MIN, above the floor $MACOSX_DEPLOYMENT_TARGET" >&2; exit 1; }
          echo "MIN_MACOS=$MIN" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        working-directory: desktop
        env:
          CI: "true"   # skips the Finder-layout AppleScript, which a runner cannot authorize
        run: |
          V=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' ../mypeople/__init__.py)
          cargo tauri build --config "{\"version\":\"$V\",\"bundle\":{\"macOS\":{\"minimumSystemVersion\":\"$MIN_MACOS\"}}}"

      # Tauri staples right after notarizing and goes on if Apple does not serve the ticket yet: run 42103746100 shipped notarized
      # but unstapled, so a Mac offline at install would refuse it. Staple until it holds, put that app in the DMG, and check it there.
      - name: Staple the app, and the DMG carries the stapled app
        run: |
          APP=desktop/src-tauri/target/release/bundle/macos/MyPlow.app
          DMG=$(ls desktop/src-tauri/target/release/bundle/dmg/*.dmg)
          for i in $(seq 1 20); do
            xcrun stapler validate "$APP" >/dev/null 2>&1 && break
            xcrun stapler staple "$APP" >/dev/null 2>&1 || sleep 30
          done
          xcrun stapler validate "$APP"
          RW="$RUNNER_TEMP/rw.sparseimage"; MNT="$RUNNER_TEMP/dmg-rw"; CHECK="$RUNNER_TEMP/dmg-check"
          hdiutil convert "$DMG" -format UDSP -o "$RW" -quiet
          hdiutil attach "$RW" -nobrowse -noautoopen -mountpoint "$MNT" -quiet
          rm -rf "$MNT/MyPlow.app" && ditto "$APP" "$MNT/MyPlow.app"
          hdiutil detach "$MNT" -quiet
          rm "$DMG" && hdiutil convert "$RW" -format UDZO -o "$DMG" -quiet
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$DMG"
          hdiutil attach "$DMG" -nobrowse -noautoopen -readonly -mountpoint "$CHECK" -quiet
          xcrun stapler validate "$CHECK/MyPlow.app"
          spctl --assess --type execute -vv "$CHECK/MyPlow.app"
          hdiutil detach "$CHECK" -quiet

      - name: Smoke test the built app
        run: desktop/scripts/smoke-test.sh

      - uses: actions/upload-artifact@v4
        with:
          name: MyPlow-dmg
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
