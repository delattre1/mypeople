<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyPlow · Access</title>
<style>
:root{--volt:#d5ef8a;--bg:#111110;--panel:#1a1a18;--ink:#f0f0e8;--muted:#9c9c94;--amber:#febc2e;--red:#ff3b30;--mono:"DM Mono","SFMono-Regular",Menlo,monospace;--sans:"DM Sans",system-ui,sans-serif;--serif:"Instrument Serif",Georgia,serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans)}
main{max-width:1000px;margin:0 auto;padding:18px 16px 60px}
h1{font:400 28px/44px var(--serif);margin:0 0 20px;padding-right:400px}
#msg:empty{display:none}
#msg{margin:0 0 14px;color:var(--amber)}
#msg a{color:inherit}
h2{font:600 16px/1.3 var(--sans);margin:26px 0 2px}
.small.sub{margin:0 0 10px}
.wait{margin-left:auto;font-size:13px;color:var(--amber)}
.panel{padding:14px 16px;margin-bottom:8px;background:var(--panel);border:1px solid #ffffff14;border-radius:12px}
.who{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.name{font-weight:600;overflow-wrap:anywhere}
.id{font:12px var(--mono);color:var(--muted);overflow-wrap:anywhere}
.ok{margin-left:auto;font-size:13px;color:var(--volt)}
.say{margin:10px 0 0;overflow-wrap:anywhere}
.small{color:var(--muted);font-size:13px;margin:8px 0 0}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
button.b{height:36px;padding:0 14px;border-radius:9px;border:1px solid #ffffff26;background:none;color:var(--ink);font:500 14px var(--sans);cursor:pointer}
button.b.go{background:var(--volt);border-color:var(--volt);color:#111110;font-weight:600}
button.b:disabled{opacity:.5;cursor:default}
button.b:focus-visible,input:focus-visible{outline:2px solid var(--volt);outline-offset:2px}
form{display:flex;gap:8px}
input{flex:1;min-width:0;height:36px;padding:0 12px;border-radius:9px;border:1px solid #ffffff26;background:#0f0f0e;color:var(--ink);font:14px var(--sans)}
.line{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 12px;background:#0f0f0e;border:1px solid #ffffff26;border-radius:9px}
.line code{flex:1;min-width:0;font:13px/1.45 var(--mono);overflow-wrap:anywhere}
textarea{display:block;width:100%;min-height:96px;margin-top:6px;padding:10px 12px;border-radius:9px;border:1px solid #ffffff26;background:#0f0f0e;color:var(--ink);font:13px/1.5 var(--mono);resize:vertical}
textarea:focus-visible{outline:2px solid var(--volt);outline-offset:2px}
.lab{display:block;margin-top:14px;color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;margin-top:8px}
.row input{flex:1}
.row.end{justify-content:flex-end}
.said{margin-top:8px;color:var(--muted);font-size:13px}
.said summary{cursor:pointer}
.said pre{margin:8px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 var(--mono);color:var(--ink)}
.find{display:flex;margin:0 0 12px}.find input{flex:1}
.tabs{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;margin:0 0 14px;border-radius:12px;background:rgba(26,26,24,.82);border:1px solid #ffffff17}
.st{height:36px;padding:0 13px;border:0;border-radius:9px;background:none;color:rgba(240,240,232,.45);font:500 13px var(--sans);cursor:pointer}
.st:hover{color:var(--ink);background:rgba(255,255,255,.05)}
.st[aria-current]{color:var(--ink);background:rgba(255,255,255,.09);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.st.hot{color:var(--amber)}
.st:focus-visible,.nm:focus-visible{outline:2px solid var(--volt);outline-offset:2px}
.two{display:grid;grid-template-columns:260px minmax(0,1fr);gap:12px;align-items:start}
.names{display:flex;flex-direction:column;gap:2px;padding:4px;background:var(--panel);border:1px solid #ffffff14;border-radius:12px}
.nm{display:flex;flex-wrap:wrap;gap:0 8px;align-items:baseline;text-align:left;padding:9px 11px;border:0;border-radius:9px;background:none;color:var(--ink);font:15px var(--sans);cursor:pointer}
.nm:hover{background:rgba(255,255,255,.05)}
.nm[aria-current]{background:rgba(255,255,255,.09)}
.nm .name,.nm .id{min-width:0}
.nm .wait{margin-left:0}
.past{margin-left:auto;font-size:13px;color:var(--muted)}
@media(max-width:760px){.two{display:block}.names{margin-bottom:10px}}
@media(max-width:700px){main{padding-top:56px}h1{padding-right:0;margin-bottom:12px}}
</style></head>
<body><main>
<h1>Access</h1>
<p id="msg" role="status"></p>
<div class="find"><input id="find" placeholder="Find someone, then use the arrow keys" aria-label="Find someone by name or machine" autocomplete="off"></div>
<div class="tabs" id="tabs" role="group" aria-label="Who to show"></div>
<div id="view"></div>
</main>
<script>
"use strict";
// Every value here came from another MyPlow, an agent or an owner's input: textContent and .value only, never markup.
const msg=document.getElementById("msg"),view=document.getElementById("view"),tabs=document.getElementById("tabs"),find=document.getElementById("find");
const PROVES="a pairing proves a message came from the MyPlow that used your line. It does not prove who owns that MyPlow.";
const TELLS="This text tells the agent that reads the message. Nothing enforces it.";
let busy=false,shown="",force=false,kept=false;  // kept: a click's error, which a poll must not wipe
let state=null,tab="",q="",line="",lineFor="";
const sel={wait:"",in:"",out:""},drafts={},asks={},opened=new Set();
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text)e.textContent=text;return e}
function fail(status,text){
  if(status===401){msg.textContent="";const a=el("a","","Log in on the board");a.href="/";msg.append(a," to see who has access.")}
  else msg.textContent=text||"Couldn't reach MyPlow.";
}
function button(cls,text,fn){const b=el("button",cls,text);b.type="button";b.onclick=fn;return b}
function who(name,host,extra){const w=el("div","who");w.append(el("span","name",name),el("span","id",host));if(extra)w.append(extra);return w}
const match=(...words)=>!q||words.join(" ").toLowerCase().includes(q.toLowerCase());
const shownList=k=>{const d=state;
  if(k==="wait")return d.requests.filter(r=>match(r.name,r.host));
  if(k==="in")return d.granted.filter(g=>match(g.name,g.host));
  if(k==="out")return d.reach.filter(g=>match(g.name,g.host));
  return d.ended.filter(h=>match(h));
};
function drawTabs(){
  tabs.replaceChildren(...[["wait","Waiting on you"],["in","Has access to you"],["out","You have access to"],["end","Ended"],["new","New line"]].map(([k,n])=>{
    const c=k==="new"?"":shownList(k).length,b=button("st"+(k==="wait"&&c?" hot":""),n+(k==="new"?"":" "+c),()=>{tab=k;force=true;draw()});
    if(tab===k)b.setAttribute("aria-current","page");
    return b;
  }));
}
function request(r){
  const p=el("div","panel");
  p.append(who(r.name+"'s agent asks for access",r.host));
  if(r.say)p.append(el("p","say","\u201c"+r.say+"\u201d"));
  p.append(el("p","small","Came with the line you generated"+(r.name!==r.host?" for "+r.name:"")+". That line is now spent. Its words are its own, and "+PROVES));
  const a=el("div","acts");
  a.append(button("b","Decline",()=>post("decline",{host:r.host})),button("b go","Grant access",()=>post("grant",{host:r.host})));
  p.append(a);return p;
}
function revoke(g){
  const b=button("b","Revoke",()=>{if(b.dataset.armed)post("remove",{host:g.host});else{b.dataset.armed="1";b.textContent="Click again to end "+g.name+"'s access"}});
  return b;
}
function hasAccess(g){
  const p=el("div","panel");
  p.append(who(g.name+"'s agent",g.host,el("span","ok","Paired")));
  const lab=el("label","lab","Permission message"),area=el("textarea");
  area.value=g.host in drafts?drafts[g.host]:g.text;area.placeholder="No message. Their messages arrive with the stamp alone.";area.setAttribute("aria-label","Permission message for "+g.name);area.oninput=()=>{drafts[g.host]=area.value};lab.append(area);p.append(lab);
  const saving=el("div","row end");saving.append(revoke(g),button("b","Save",async()=>{if(await post("save",{host:g.host,text:area.value}))delete drafts[g.host]}));p.append(saving);
  const asking=el("div","row"),say=el("input");say.placeholder="Ask your agent to change this";say.setAttribute("aria-label","Ask your agent to change the message for "+g.name);say.maxLength=1000;say.value=asks[g.host]||"";say.oninput=()=>{asks[g.host]=say.value};
  asking.append(say,button("b","Ask",async()=>{if(await post("ask",{host:g.host,text:say.value}))delete asks[g.host]}));p.append(asking);
  p.append(el("p","small",g.asking?"Your agent is rewriting it.":"Applies from "+g.name+"'s next message. "+TELLS));
  const said=el("details","said");said.open=opened.has(g.host);
  said.ontoggle=()=>{said.open?opened.add(g.host):opened.delete(g.host)};
  said.append(el("summary","","What it tells the agent"),el("pre","",g.package));p.append(said);
  return p;
}
// No permission message here: that text belongs to the messages you receive. What you asked, where it stands, and ending it.
function youReach(g){
  const p=el("div","panel");
  p.append(who(g.name+"'s agent",g.host,g.waiting?el("span","wait","Waiting for their owner"):el("span","ok","Paired")));
  if(g.said)p.append(el("p","say","You said: \u201c"+g.said+"\u201d"));
  if(g.waiting){p.append(el("p","small","Nothing is shared until they grant it."));return p}
  const a=el("div","acts");a.append(revoke(g));p.append(a);return p;
}
function newLine(){
  const p=el("div","panel"),f=el("form"),i=el("input");
  i.placeholder="Who is this line for?";i.setAttribute("aria-label","Who is this line for?");i.maxLength=60;i.value=lineFor;i.oninput=()=>{lineFor=i.value};
  const b=el("button","b","Generate a line");b.type="submit";f.onsubmit=e=>{e.preventDefault();post("line",{name:i.value})};f.append(i,b);p.append(f);
  if(line){
    const box=el("div","line");box.append(el("code","",line));
    const c=button("b","Copy",async()=>{try{await navigator.clipboard.writeText(line);c.textContent="Copied"}catch(e){msg.textContent="Select the line and copy it."}});
    box.append(c);p.append(box,el("p","small","Good for 24 h and one use. Whoever runs it asks for access to this MyPlow; nothing is shared until you grant it here."));
  }
  return p;
}
function drawView(){
  if(tab==="new")return view.replaceChildren(newLine());
  const list=shownList(tab);
  if(tab==="end")return view.replaceChildren(...(list.length?list.map(h=>{const p=el("div","panel");p.append(who(h+"'s agent",h,el("span","past","Ended")));return p}):[el("p","small",q?"Nobody here matches.":"Nobody yet.")]));
  if(!list.length)return view.replaceChildren(el("p","small",q?"Nobody here matches.":tab==="wait"?"Nobody is waiting.":"Nobody yet."));
  if(!list.find(x=>x.host===sel[tab]))sel[tab]=list[0].host;
  const names=el("div","names"),cur=list.find(x=>x.host===sel[tab]);
  names.append(...list.map(x=>{const b=button("nm","",()=>{sel[tab]=x.host;force=true;draw()});b.dataset.host=x.host;b.append(el("span","name",x.name),el("span","id",x.host));if(x.waiting)b.append(el("span","wait","Waiting"));if(x.host===sel[tab])b.setAttribute("aria-current","true");return b}));
  const two=el("div","two"),one=el("div");one.append(tab==="wait"?request(cur):tab==="in"?hasAccess(cur):youReach(cur));two.append(names,one);
  const top=tab==="in"?"You decide what your agent is told about each of them.":tab==="out"?"You asked these. What each one allows you is decided on their machine.":"";
  view.replaceChildren(...(top?[el("p","small sub",top)]:[]),two);
}
function draw(){
  if(!state)return;
  if(!tab)tab=state.requests.length?"wait":"in";
  drawTabs();
  // The 5 s poll must not redraw what they are typing in.
  const a=document.activeElement;
  if(!force&&!busy&&a&&view.contains(a)&&(a.tagName==="TEXTAREA"||a.tagName==="INPUT"))return;
  force=false;drawView();
}
find.oninput=()=>{q=find.value.trim();force=true;draw()};
document.addEventListener("keydown",e=>{
  if((e.key!=="ArrowDown"&&e.key!=="ArrowUp")||!state||!(tab in sel))return;
  const t=e.target;if(t&&(t.tagName==="TEXTAREA"||(t.tagName==="INPUT"&&t!==find)))return;
  const list=shownList(tab),i=list.findIndex(x=>x.host===sel[tab]),next=list[i+(e.key==="ArrowDown"?1:-1)];
  if(!next)return;
  e.preventDefault();sel[tab]=next.host;force=true;draw();
  if(t!==find){const b=[...view.querySelectorAll("button")].find(x=>x.dataset.host===next.host);if(b)b.focus()}
});
async function load(){
  if(busy)return;
  try{
    const r=await fetch("/todo/access",{credentials:"same-origin"});
    if(!r.ok)return fail(r.status);
    const d=await r.json(),now=JSON.stringify(d);
    if(!busy){if(!kept)msg.textContent="";if(now!==shown||force){shown=now;state=d;draw()}}
  }catch(e){fail(0)}
}
async function post(op,body){
  busy=true;kept=false;
  view.querySelectorAll("button").forEach(b=>b.disabled=true);
  let d={},ok=false;
  try{
    const r=await fetch("/todo/access/"+op,{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    d=await r.json().catch(()=>({}));
    ok=r.ok;
    if(!r.ok){kept=true;fail(r.status,d.error)}else msg.textContent="";
  }catch(e){kept=true;fail(0)}
  busy=false;shown="";force=true;
  if(d.line)line=d.line;
  if(ok&&op==="grant"){tab="in";sel.in=body.host}   // on to the text they will arrive with
  await load();
  force=true;draw();
  return ok;
}
load();setInterval(load,5000);
</script>
</body></html>
