</style><style>#modal{z-index:120}.taskbar{right:18px}#viewport{right:0}.backlog-zone{position:absolute;width:340px;padding:10px;border:1px solid #c4bfff55;border-radius:16px;background:#11130ff2;box-shadow:0 18px 60px #000a}.backlog-zone .backlog-head{padding:4px 5px 10px}.backlog-stack{max-height:640px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:3px}.task-node.in-backlog{position:relative;left:auto!important;top:auto!important;width:100%!important;height:88px!important;min-height:88px;flex:none}.task-node.in-backlog .task-title{font-size:12px}.backlog-zone.empty .backlog-stack{min-height:90px}</style></head>
<body><div id="app"><div class="topbar"><div class="mark">P</div><div><div class="title">Terminal Graph</div><div class="meta"><span class="live"><span class="dot"></span>live fleet + shared tasks</span> · <span id="counts">connecting</span></div></div><div class="grow"></div><button class="tool" id="fit">FIT FLEET</button><button class="tool" id="center">BOSS</button><div class="zoom" id="zoom">100%</div></div>

<div id="viewport"><div id="world"><svg class="edges" id="edges"></svg><section class="backlog-zone" id="backlogZone"><div class="backlog-head"><div class="backlog-title">Backlog / Unassigned</div><div class="backlog-meta" id="backlogMeta">loading shared board…</div></div><div class="backlog-stack" id="backlogStack"></div></section><div id="nodes"></div></div></div><div class="legend"><b class="working"><span class="dot"></span>working</b><b class="idle"><span class="dot"></span>idle</b><b class="blocked"><span class="dot"></span>blocked</b></div><div class="hint">all project work is inside the canvas · pan · zoom · click any task</div></div>

<script>
"use strict";
const viewport=document.getElementById("viewport"),world=document.getElementById("world"),nodesEl=document.getElementById("nodes"),edgesEl=document.getElementById("edges");
const POSITION_KEY="mp_terminal_graph_positions_v2",FILTER_KEY="mp_terminal_graph_task_filters",TERMINAL_SCALE=.36,nodeEls=new Map(),taskEls=new Map(),positions=JSON.parse(localStorage.getItem(POSITION_KEY)||"{}");let graph={nodes:[],edges:[],tasks:[],task_edges:[],layoutItems:[]},board={tasks:{},order:[]},view={x:(innerWidth-360)/2,y:135,scale:.72},drag=null,pan=null,roPort=7682,rwPort=7681,uniformScale=TERMINAL_SCALE,openTaskId="",search="";const DEFAULT_STATES=["needs_brainstorm","working","review","blocked","recurring"],enabledStates=new Set(JSON.parse(localStorage.getItem(FILTER_KEY)||"null")||DEFAULT_STATES);
const esc=s=>String(s).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ttyUrl=(port,target)=>location.protocol==="https:"?`${port===roPort?"/ttyd-ro/":"/ttyd-rw/"}?arg=-t&arg=${encodeURIComponent(target)}`:`${location.protocol}//${location.hostname}:${port}/?arg=-t&arg=${encodeURIComponent(target)}`;
const api=(path,opts={})=>fetch(path,{credentials:"same-origin",...opts,headers:{"Content-Type":"application/json",...(opts.headers||{})}});
const taskVisible=t=>enabledStates.has(t.state)&&(!search||`${t.id} ${t.title||""} ${t.assignee||""}`.toLowerCase().includes(search));
function applyView(){world.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.scale})`;document.getElementById("zoom").textContent=Math.round(view.scale*100)+"%"}
function savePositions(){const horizontal={};for(const id of nodeEls.keys()){const p=positions[id];if(p)horizontal[id]={x:p.x}}localStorage.setItem(POSITION_KEY,JSON.stringify(horizontal))}
function layoutId(item){return item.layout_id||(item.kind==="task"?"task:"+item.id:item.agent_id)}
function applyHierarchy(data){
 const byId=new Map(data.nodes.map(n=>[n.agent_id,n])),children=new Map(data.nodes.map(n=>[n.agent_id,[]])),parent=new Map();
 for(const e of data.edges)if(byId.has(e.from)&&byId.has(e.to)){children.get(e.from).push(e.to);parent.set(e.to,e.from)}
 for(const list of children.values())list.sort();
 const boss=data.nodes.find(n=>n.is_master),depth=new Map();
 if(boss){depth.set(boss.agent_id,0);const queue=[boss.agent_id];while(queue.length){const id=queue.shift(),d=depth.get(id);for(const child of children.get(id)||[])if(!depth.has(child)){depth.set(child,d+1);queue.push(child)}}}
 for(const n of data.nodes)if(!depth.has(n.agent_id)){let d=1,p=parent.get(n.agent_id),seen=new Set([n.agent_id]);while(p&&!seen.has(p)){seen.add(p);if(depth.has(p)){d=depth.get(p)+1;break}d++;p=parent.get(p)}depth.set(n.agent_id,d)}
 for(const n of data.nodes){n.kind="terminal";n.layout_id=n.agent_id;n.parent_id=n.boss_id;n.depth=depth.get(n.agent_id)||0}
 for(const t of data.tasks){t.kind="task";t.layout_id="task:"+t.id;t.parent_id=t.assignee;t.depth=(depth.get(t.assignee)||0)+1}
 const items=[...data.nodes,...data.tasks];data.layoutItems=items;const rows=new Map();
 for(const item of items){if(!rows.has(item.depth))rows.set(item.depth,[]);rows.get(item.depth).push(item)}
 let y=0;
 for(const d of [...rows.keys()].sort((a,b)=>a-b)){
  const row=rows.get(d);row.sort((a,b)=>{if(a.is_master)return-1;if(b.is_master)return 1;const ap=positions[a.parent_id],bp=positions[b.parent_id],ax=ap?ap.x+ap.width/2:0,bx=bp?bp.x+bp.width/2:0;return ax-bx||(a.kind===b.kind?layoutId(a).localeCompare(layoutId(b)):a.kind==="terminal"?-1:1)});
  const defaults=new Map();
  if(row.every(n=>n.kind==="task")){
   const groups=new Map();for(const item of row){if(!groups.has(item.parent_id))groups.set(item.parent_id,[]);groups.get(item.parent_id).push(item)}
   const ordered=[...groups.entries()].sort((a,b)=>{const ap=positions[a[0]],bp=positions[b[0]];return(ap.x+ap.width/2)-(bp.x+bp.width/2)});let previousRight=-Infinity;
   for(const[parentId,group]of ordered){group.sort((a,b)=>a.id.localeCompare(b.id));const parentBox=positions[parentId],gap=40,total=group.reduce((s,n)=>s+n.nodeW,0)+gap*Math.max(0,group.length-1);let cursor=parentBox.x+parentBox.width/2-total/2;if(cursor<previousRight+60)cursor=previousRight+60;for(const item of group){defaults.set(layoutId(item),cursor);cursor+=item.nodeW+gap}previousRight=cursor-gap}
  }else{
   const gap=80,total=row.reduce((s,n)=>s+n.nodeW,0)+gap*Math.max(0,row.length-1);let cursor=-total/2;for(const item of row){defaults.set(layoutId(item),cursor);cursor+=item.nodeW+gap}
  }
  let useSaved=row.every(n=>n.kind==="terminal"&&!n.is_master&&positions[n.agent_id]&&Number.isFinite(positions[n.agent_id].x));
  if(useSaved)for(let i=1;i<row.length;i++){const a=row[i-1],b=row[i];if(positions[b.agent_id].x<positions[a.agent_id].x+a.nodeW+40){useSaved=false;break}}
  for(const item of row){const id=layoutId(item),x=item.is_master?-item.nodeW/2:(useSaved?positions[id].x:defaults.get(id));positions[id]={x,y,depth:d,width:item.nodeW,height:item.nodeH}}
  y+=Math.max(...row.map(n=>n.nodeH))+120;
 }
}
function constrainedX(id,wanted){const p=positions[id],row=graph.layoutItems.filter(n=>n.depth===p.depth).sort((a,b)=>positions[layoutId(a)].x-positions[layoutId(b)].x),i=row.findIndex(n=>layoutId(n)===id),n=row[i];let min=-Infinity,max=Infinity;if(i>0){const prev=row[i-1],pp=positions[layoutId(prev)];min=pp.x+prev.nodeW+40}if(i<row.length-1){const next=row[i+1],np=positions[layoutId(next)];max=np.x-n.nodeW-40}return Math.max(min,Math.min(max,wanted))}
function makeNode(n,i){const el=document.createElement("article");el.className="node";el.dataset.id=n.agent_id;el.innerHTML=`<div class="chrome"><span class="lights"><i></i><i></i><i></i></span><span class="name"></span><span class="state"><span class="dot"></span><em></em></span></div><div class="screen"><div class="terminal-canvas"><iframe title="Live read-only terminal"></iframe></div><button class="open-hit" aria-label="Open interactive terminal full screen"></button></div>`;nodesEl.appendChild(el);nodeEls.set(n.agent_id,el);
 const header=el.querySelector(".chrome");header.addEventListener("pointerdown",e=>{e.stopPropagation();if(el.dataset.master==="true")return;header.setPointerCapture(e.pointerId);const p=positions[n.agent_id];drag={id:n.agent_id,sx:e.clientX,ox:p.x};el.classList.add("dragging")});header.addEventListener("pointermove",e=>{if(!drag||drag.id!==n.agent_id)return;positions[n.agent_id].x=constrainedX(n.agent_id,drag.ox+(e.clientX-drag.sx)/view.scale);placeNodes();drawEdges()});header.addEventListener("pointerup",()=>{drag=null;el.classList.remove("dragging");savePositions()});el.querySelector(".open-hit").onclick=()=>openTerminal(n.agent_id);return el}
function updateNode(el,n){el.dataset.state=n.state;el.dataset.master=n.is_master;el.dataset.depth=n.depth;el.querySelector(".name").innerHTML=(n.is_master?'<span class="boss-tag">BOSS</span> · ':"")+esc(n.agent_id);el.querySelector(".state em").textContent=n.state;el.style.width=n.nodeW+"px";el.style.height=n.nodeH+"px";const screen=el.querySelector(".screen"),frame=el.querySelector("iframe"),canvas=el.querySelector(".terminal-canvas");screen.style.width=n.screenW+"px";screen.style.height=n.screenH+"px";frame.style.width=n.frameW+"px";frame.style.height=n.frameH+"px";canvas.style.transform=`scale(${uniformScale})`;if(frame.dataset.target!==n.target){frame.dataset.target=n.target;frame.src=ttyUrl(roPort,n.target)}}
function makeTaskNode(t){const el=document.createElement("button");el.type="button";el.className="task-node";el.innerHTML='<div class="task-top"><span>TASK</span><span class="task-id"></span><span class="task-status"></span></div><div class="task-title"></div>';el.onclick=()=>openTask(el.dataset.id);nodesEl.appendChild(el);taskEls.set(t.id,el);return el}
function updateTaskNode(el,t,inBacklog){el.dataset.id=t.id;el.dataset.owner=t.assignee;el.dataset.state=t.state;el.dataset.depth=t.depth||"";el.dataset.zone=inBacklog?"backlog":"owner";el.classList.toggle("in-backlog",inBacklog);el.querySelector(".task-id").textContent=t.id;el.querySelector(".task-status").textContent=t.state.replaceAll("_"," ");el.querySelector(".task-title").textContent=t.title||"Untitled task"}
function reconcile(data){const allTasks=data.allTasks||data.tasks||[],allEdges=data.allTaskEdges||data.task_edges||[],visible=allTasks.filter(taskVisible),placed=visible.filter(t=>t.owner_live&&!t.archived),backlog=visible.filter(t=>!t.owner_live||t.archived),layoutData={...data,tasks:placed,task_edges:allEdges.filter(e=>placed.some(t=>"task:"+t.id===e.to))};graph=layoutData;graph.allTasks=allTasks;graph.allTaskEdges=allEdges;graph.backlogTasks=backlog;roPort=data.readonly_port||7682;rwPort=data.interactive_port||7681;uniformScale=TERMINAL_SCALE;for(const n of data.nodes){n.frameW=Math.max(480,n.cols*6.25);n.frameH=Math.max(260,n.rows*12.5);n.renderW=n.frameW*uniformScale;n.renderH=n.frameH*uniformScale;n.screenW=Math.ceil(n.renderW+8);n.screenH=Math.ceil(n.renderH+8);n.nodeW=n.screenW+14;n.nodeH=n.screenH+48}for(const t of placed){t.nodeW=270;t.nodeH=112}const wanted=new Set(data.nodes.map(n=>n.agent_id));for(const[id,el]of nodeEls)if(!wanted.has(id)){el.remove();nodeEls.delete(id);delete positions[id]}const wantedTasks=new Set(visible.map(t=>t.id));for(const[id,el]of taskEls)if(!wantedTasks.has(id)){el.remove();taskEls.delete(id);delete positions["task:"+id]}applyHierarchy(layoutData);data.nodes.forEach((n,i)=>{const el=nodeEls.get(n.agent_id)||makeNode(n,i);updateNode(el,n)});const stack=document.getElementById("backlogStack");for(const t of placed){const el=taskEls.get(t.id)||makeTaskNode(t);if(el.parentElement!==nodesEl)nodesEl.appendChild(el);updateTaskNode(el,t,false)}for(const t of backlog){const el=taskEls.get(t.id)||makeTaskNode(t);if(el.parentElement!==stack)stack.appendChild(el);updateTaskNode(el,t,true)}const boxes=[...nodeEls.keys(),...placed.map(t=>"task:"+t.id)].map(id=>positions[id]).filter(Boolean),minX=boxes.length?Math.min(...boxes.map(p=>p.x)):0;const zone={x:minX-390,y:0,width:340,height:Math.min(720,70+backlog.length*96)};positions.__backlog__=zone;const zoneEl=document.getElementById("backlogZone");zoneEl.style.left=zone.x+"px";zoneEl.style.top=zone.y+"px";zoneEl.style.height=Math.max(150,zone.height)+"px";graph.layoutItems.push({kind:"backlog",layout_id:"__backlog__"});savePositions();placeNodes();drawEdges();renderBacklog();const working=data.nodes.filter(n=>n.state==="working").length;document.getElementById("counts").textContent=`${data.nodes.length} terminals · ${allTasks.length} shared tasks · ${placed.length} placed · ${backlog.length} backlog · ${working} working`}
const reconcileHierarchy=reconcile;reconcile=function(data){reconcileHierarchy(data);const boxes=[...nodeEls.keys(),...[...(graph.tasks||[])].map(t=>"task:"+t.id)].map(id=>positions[id]).filter(Boolean),maxX=boxes.length?Math.max(...boxes.map(p=>p.x+p.width)):0,zone=positions.__backlog__;zone.x=maxX+100;document.getElementById("backlogZone").style.left=zone.x+"px"};
function placeNodes(){for(const[id,el]of nodeEls){const p=positions[id];el.style.left=p.x+"px";el.style.top=p.y+"px"}for(const[id,el]of taskEls){if(el.classList.contains("in-backlog"))continue;const p=positions["task:"+id];el.style.left=p.x+"px";el.style.top=p.y+"px"}}
function edgePath(e,task){const a=positions[e.from],b=positions[e.to];if(!a||!b)return;const sx=a.x+a.width/2,sy=a.y+a.height,ex=b.x+b.width/2,ey=b.y,mid=sy+(ey-sy)/2,p=document.createElementNS("http://www.w3.org/2000/svg","path");p.setAttribute("class",task?"edge task-edge":"edge");p.setAttribute("d",`M ${sx} ${sy} C ${sx} ${mid}, ${ex} ${mid}, ${ex} ${ey}`);edgesEl.appendChild(p);if(!task){const flow=p.cloneNode();flow.setAttribute("class","edge edge-flow");edgesEl.appendChild(flow)}}

function renderBacklog(){const items=graph.backlogTasks||[],zone=document.getElementById("backlogZone");zone.classList.toggle("empty",!items.length);document.getElementById("backlogMeta").textContent=`${items.length} stacked here · unassigned / missing / retired owners + archive`;let empty=document.getElementById("backlogEmpty");if(!items.length&&!empty){empty=document.createElement("div");empty.id="backlogEmpty";empty.className="backlog-empty";empty.textContent="No backlog/archive cards match these filters.";document.getElementById("backlogStack").appendChild(empty)}else if(items.length&&empty)empty.remove()}
const epoch=ts=>{let n=Number(ts)||0;return n<1e12?n*1000:n};function fmtTime(ts){if(!ts)return"";return new Date(epoch(ts)).toLocaleString()}
function appendProof(parent,p){const body=document.createElement("div");body.className="event-body";if(p.kind==="image"){const im=document.createElement("img");im.src=p.url;im.alt=p.body||"proof image";body.appendChild(im)}else if(p.kind==="video"){const v=document.createElement("video");v.src=p.url;v.controls=true;body.appendChild(v)}else if(p.url){const a=document.createElement("a");a.href=p.url;a.target="_blank";a.rel="noopener noreferrer";a.textContent=p.body||p.url;body.appendChild(a)}else body.textContent=p.body||"(proof)";parent.appendChild(body)}
let modalSig="";
let refreshReq=0;   // monotonic id: a late-arriving stale /todo/board response must not clobber a newer one
function renderTaskModal(force=false){const t=board.tasks&&board.tasks[openTaskId];if(!t){if(openTaskId)closeTask(false);return}const sig=JSON.stringify([t.text,t.state,t.assignee,t.doneCondition,t.workToDone,t.ownerNeedsReplacement,t.comments,t.proofs,t.ownerHistory,t.brainstorm,t.questions,t.answers,t.artifacts]);if(!force&&sig===modalSig)return;modalSig=sig;const m=document.getElementById("taskModal");const _oldTa=m.querySelector(".tm-compose textarea");const _draft=_oldTa?_oldTa.value:null;const _draftFocused=_oldTa&&document.activeElement===_oldTa;const _selS=_oldTa?_oldTa.selectionStart:null,_selE=_oldTa?_oldTa.selectionEnd:null;m.replaceChildren();const head=document.createElement("div");head.className="tm-head";const hw=document.createElement("div");hw.style.flex="1";const id=document.createElement("div");id.className="tm-id";id.textContent=`TASK ${t.id}`;const title=document.createElement("h2");title.className="tm-title";title.textContent=t.text||"Untitled task";hw.append(id,title);const close=document.createElement("button");close.className="close";close.textContent="CLOSE ✕";close.onclick=()=>closeTask();head.append(hw,close);const controls=document.createElement("div");controls.className="tm-controls";const sl=document.createElement("label");sl.textContent="state ";const sel=document.createElement("select");for(const s of ["needs_brainstorm","working","review","blocked","recurring","done","cancelled"]){const o=document.createElement("option");o.value=s;o.textContent=s.replaceAll("_"," ");o.selected=t.state===s;sel.appendChild(o)}sel.onchange=async()=>{const r=await api("/todo/status",{method:"POST",body:JSON.stringify({task_id:t.id,state:sel.value,by:"CEO"})});if(!r.ok){const d=await r.json();alert(d.error||"State change rejected")};await refresh(true)};sl.appendChild(sel);const owner=document.createElement("span");owner.className="tm-owner";owner.textContent=t.assignee||"unassigned";controls.append(sl,document.createTextNode("owner: "),owner);if(t.assignee){const ob=document.createElement("button");ob.className="tm-open-owner";ob.textContent="OPEN OWNER TERMINAL";ob.onclick=()=>openOwnerTerminal(t.assignee);controls.appendChild(ob)}const del=document.createElement("button");del.className="tm-delete";del.textContent="DELETE";del.onclick=async()=>{if(confirm("Delete this task from the shared board?")){await api("/todo/update",{method:"POST",body:JSON.stringify({op:"del",id:t.id,by:"CEO"})});closeTask();await refresh(true)}};controls.appendChild(del);const body=document.createElement("div");body.className="tm-body";const details=document.createElement("div");details.className="tm-details";const tl=document.createElement("label");tl.textContent="full title";const ti=document.createElement("textarea");ti.rows=4;ti.value=t.text||"";const dl=document.createElement("label");dl.textContent="done condition";const dc=document.createElement("textarea");dc.rows=4;dc.value=t.doneCondition||"";const save=document.createElement("button");save.className="tm-save";save.textContent="SAVE DETAILS";save.onclick=async()=>{await api("/todo/update",{method:"POST",body:JSON.stringify({op:"set",id:t.id,text:ti.value,doneCondition:dc.value,by:"CEO"})});await refresh(true)};details.append(tl,ti,dl,dc,save);const extra=document.createElement("div");extra.className="tm-extra";for(const key of ["workToDone","brainstorm","questions","answers","artifacts"]){if(t[key]!==undefined&&t[key]!==""&&t[key]!==false){const l=document.createElement("label");l.textContent=key;const v=document.createElement("div");v.textContent=typeof t[key]==="string"?t[key]:JSON.stringify(t[key],null,2);extra.append(l,v)}}details.appendChild(extra);const oh=document.createElement("label");oh.textContent="owner history";details.appendChild(oh);for(const e of (t.ownerHistory||[])){const row=document.createElement("div");row.className="owner-event";row.textContent=`${e.action||"owner"} · ${e.agent_id||""}${e.previous?" · previous "+e.previous:""} · ${fmtTime(e.ts)}`;details.appendChild(row)}const thread=document.createElement("div");thread.className="tm-thread";const events=[...(t.comments||[]).map(x=>({...x,_type:"comment"})),...(t.proofs||[]).map(x=>({...x,_type:"proof"}))].sort((a,b)=>(Number(a.ts)||0)-(Number(b.ts)||0));for(const e of events){const ev=document.createElement("article");ev.className="event";const eh=document.createElement("div");eh.className="event-head";eh.textContent=e._type==="proof"?`PROOF · ${e.kind||"text"} · ${fmtTime(e.ts)}`:`${e.by||"unknown"} · ${fmtTime(e.ts)}`;ev.appendChild(eh);if(e._type==="proof")appendProof(ev,e);else{const eb=document.createElement("div");eb.className="event-body";eb.textContent=e.body||"";ev.appendChild(eb)}thread.appendChild(ev)}if(!events.length){const e=document.createElement("div");e.className="backlog-empty";e.textContent="No comments or proofs yet.";thread.appendChild(e)}body.append(details,thread);const comp=document.createElement("div");comp.className="tm-compose";const ta=document.createElement("textarea");ta.placeholder="Comment, answer a brainstorm question, or instruct the owner…";if(_draft!==null)ta.value=_draft;const send=document.createElement("button");send.className="tm-send";send.textContent="SEND";const post=async()=>{const v=ta.value.trim();if(!v)return;ta.value="";await api("/todo/comment",{method:"POST",body:JSON.stringify({task_id:t.id,body:v,by:"CEO"})});await refresh(true)};send.onclick=post;ta.onkeydown=e=>{if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)){e.preventDefault();post()}};comp.append(ta,send);m.append(head,controls,body,comp);if(_draftFocused){ta.focus();try{ta.setSelectionRange(_selS,_selE)}catch(e){}}}
function openTask(id,fromHistory=false){if(!board.tasks||!board.tasks[id]){api("/todo/board",{cache:"no-store"}).then(r=>r.json()).then(b=>{board=b;if(board.tasks&&board.tasks[id])openTask(id,fromHistory)});return}openTaskId=id;document.getElementById("taskModalBg").classList.add("open");modalSig="";renderTaskModal(true);if(!fromHistory){const u=new URL(location.href);u.searchParams.set("task",id);history.pushState({task:id},"",u)}}
function closeTask(push=true){openTaskId="";modalSig="";document.getElementById("taskModalBg").classList.remove("open");if(push){const u=new URL(location.href);u.searchParams.delete("task");history.pushState({},"",u)}}
async function openOwnerTerminal(agent){const r=await api("/todo/attach?agent="+encodeURIComponent(agent));if(!r.ok)return;const d=await r.json();document.getElementById("modalname").textContent=agent;document.getElementById("interactive").src=ttyUrl(rwPort,d.target);document.getElementById("modal").classList.add("open")}
async function refresh(force=false){const myReq=++refreshReq;try{const [tr,br]=await Promise.all([api("/todo/terminal-graph",{cache:"no-store"}),api("/todo/board",{cache:"no-store"})]);if(myReq!==refreshReq)return;if(!tr.ok)throw Error(tr.status);if(br.ok)board=await br.json();reconcile(await tr.json());if(openTaskId)renderTaskModal(force);const deep=new URL(location.href).searchParams.get("task");if(deep&&!openTaskId&&board.tasks&&board.tasks[deep])openTask(deep,true)}catch(e){document.getElementById("counts").textContent="metadata offline · terminals stay connected"}}
function openTerminal(id){const n=graph.nodes.find(x=>x.agent_id===id);if(!n)return;document.getElementById("modalname").textContent=n.agent_id;document.getElementById("interactive").src=ttyUrl(rwPort,n.target);document.getElementById("modal").classList.add("open")}
function closeTerminal(){document.getElementById("modal").classList.remove("open");document.getElementById("interactive").src="about:blank"}document.getElementById("close").onclick=closeTerminal;addEventListener("keydown",e=>{if(e.key==="Escape"){if(document.getElementById("modal").classList.contains("open"))closeTerminal();else if(openTaskId)closeTask()}});
viewport.addEventListener("pointerdown",e=>{if(e.target!==viewport)return;viewport.setPointerCapture(e.pointerId);pan={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};viewport.classList.add("panning")});viewport.addEventListener("pointermove",e=>{if(!pan)return;view.x=pan.vx+e.clientX-pan.x;view.y=pan.vy+e.clientY-pan.y;applyView()});viewport.addEventListener("pointerup",()=>{pan=null;viewport.classList.remove("panning")});viewport.addEventListener("wheel",e=>{e.preventDefault();const old=view.scale,next=Math.max(.2,Math.min(1.35,old*Math.exp(-e.deltaY*.001)));view.x=e.clientX-(e.clientX-view.x)*next/old;view.y=e.clientY-(e.clientY-view.y)*next/old;view.scale=next;applyView()},{passive:false});
document.getElementById("center").onclick=()=>{view={x:viewport.clientWidth/2,y:135,scale:.72};applyView()};document.getElementById("fit").onclick=()=>{const ps=graph.layoutItems.map(n=>positions[layoutId(n)]).filter(Boolean);if(!ps.length)return;const minX=Math.min(...ps.map(p=>p.x)),maxX=Math.max(...ps.map(p=>p.x+p.width)),minY=Math.min(...ps.map(p=>p.y)),maxY=Math.max(...ps.map(p=>p.y+p.height)),s=Math.min((viewport.clientWidth-80)/(maxX-minX),(innerHeight-175)/(maxY-minY),1);view.scale=Math.max(.2,s);view.x=(viewport.clientWidth-(minX+maxX)*view.scale)/2;view.y=125-minY*view.scale;applyView()};
document.querySelectorAll(".filter").forEach(b=>{b.classList.toggle("on",enabledStates.has(b.dataset.state));b.onclick=()=>{if(enabledStates.has(b.dataset.state))enabledStates.delete(b.dataset.state);else enabledStates.add(b.dataset.state);localStorage.setItem(FILTER_KEY,JSON.stringify([...enabledStates]));b.classList.toggle("on",enabledStates.has(b.dataset.state));reconcile({...graph,tasks:graph.allTasks||graph.tasks,task_edges:graph.task_edges||[]})}});document.getElementById("taskSearch").oninput=e=>{search=e.target.value.trim().toLowerCase();reconcile({...graph,tasks:graph.allTasks||graph.tasks,task_edges:graph.task_edges||[]})};const createTask=async()=>{const i=document.getElementById("newTask"),text=i.value.trim();if(!text)return;i.value="";const r=await api("/todo/update",{method:"POST",body:JSON.stringify({op:"add",text,by:"CEO"})});const d=await r.json();await refresh(true);if(d.id)openTask(d.id)};document.getElementById("addTask").onclick=createTask;document.getElementById("newTask").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();createTask()}};document.getElementById("taskModalBg").onclick=e=>{if(e.target.id==="taskModalBg")closeTask()};addEventListener("popstate",()=>{const id=new URL(location.href).searchParams.get("task");if(id&&board.tasks&&board.tasks[id])openTask(id,true);else{openTaskId="";document.getElementById("taskModalBg").classList.remove("open")}});
