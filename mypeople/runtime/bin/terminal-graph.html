<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyPlow · Terminal Graph</title>
<style>
:root{--volt:#d5ef8a;--grove:#5e7a5e;--bg:#111110;--panel:#1a1a18;--ink:#f0f0e8;--muted:#9c9c94;--line:#71804c;--amber:#febc2e;--red:#ff3b30;--mono:"DM Mono","SFMono-Regular",Menlo,monospace;--sans:"DM Sans",system-ui,sans-serif;--serif:"Instrument Serif",Georgia,serif}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
#app{height:100%;position:relative}.topbar{position:absolute;z-index:20;left:18px;right:auto;max-width:calc(100% - 250px);top:18px;height:44px;display:flex;align-items:center;gap:10px;padding:0 5px 0 14px;border:1px solid #ffffff17;border-radius:12px;background:#1a1a18db;box-shadow:0 8px 30px #0005;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.mark{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:var(--volt);color:var(--grove);font:26px var(--serif)}.title{font:24px var(--serif);white-space:nowrap}.meta{min-width:0;font:400 12px/1 var(--mono);letter-spacing:.02em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta .live{font:500 12px/1 var(--sans);margin-right:6px}.sep{width:1px;height:18px;background:#ffffff17;flex:0 0 auto}.live{color:var(--volt)}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor;margin-right:6px}.grow{flex:1}.tool{height:32px;border:1px solid transparent;background:none;color:#f0f0e8bd;border-radius:9px;padding:0 11px;font:500 13px var(--sans);cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}.tool:hover{background:#ffffff0f;color:var(--ink)}.tool.icon{width:32px;padding:0;display:grid;place-items:center}.zoom{min-width:54px;text-align:center;color:var(--muted);font:400 12px var(--mono);font-variant-numeric:tabular-nums}
#viewport{position:absolute;left:0;top:0;right:0;bottom:0;overflow:hidden;cursor:grab;background-image:radial-gradient(#d5ef8a18 1px,transparent 1px);background-size:24px 24px}#viewport.panning{cursor:grabbing}#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}.edges{position:absolute;overflow:visible;left:0;top:0;pointer-events:none}.edge{stroke:var(--line);stroke-width:2;fill:none;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 5px #d5ef8a36)}.edge-flow{stroke:var(--volt);stroke-width:1;stroke-dasharray:5 13;animation:flow 1.6s linear infinite;opacity:.65}@keyframes flow{to{stroke-dashoffset:-18}}
.node{position:absolute;padding:6px;border:1px solid #ffffff1c;border-radius:14px;background:#1a1a18;box-shadow:0 20px 60px #0009;overflow:hidden;user-select:none;transition:border-color .2s,opacity .2s,filter .2s}.node:hover{border-color:#d5ef8a70}.node[data-master="true"]{border-color:#d5ef8a9c;box-shadow:0 0 0 1px #d5ef8a26,0 24px 80px #000b,0 0 50px #d5ef8a12}.node[data-state="idle"]{opacity:.62;filter:saturate(.55)}.node[data-state="blocked"]{border-color:#ff3b3088}.node[data-state="working"]{border-color:#febc2e88}.node.dragging{z-index:5;transition:none;box-shadow:0 28px 90px #000d}
.chrome{height:34px;display:flex;align-items:center;gap:7px;padding:0 2px;cursor:move}.lights{display:flex;gap:5px}.lights i{width:8px;height:8px;border-radius:50%;background:#596057}.lights i:first-child{background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}.name{min-width:0;font:10px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.boss-tag{color:var(--volt);font-weight:700}.state{margin-left:auto;font:8px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.node[data-state="working"] .state{color:var(--amber)}.node[data-state="working"] .state .dot{animation:pulse 1.2s ease-in-out infinite}.node[data-state="blocked"] .state{color:var(--red)}.node[data-state="ready"] .state{color:var(--volt)}@keyframes pulse{50%{opacity:.3}}@media (prefers-reduced-motion:reduce){.edge-flow,.node .state .dot{animation:none!important}}
.screen{position:relative;border-radius:8px;overflow:hidden;background:#050605;border:1px solid #ffffff12}.terminal-canvas{position:absolute;left:4px;top:4px;transform-origin:0 0;pointer-events:none}.terminal-canvas iframe{display:block;border:0;background:#050605}.open-hit{position:absolute;inset:0;z-index:2;cursor:zoom-in;background:transparent}.open-hit:after{content:"Open live terminal";position:absolute;right:8px;bottom:8px;padding:5px 9px;border-radius:7px;background:var(--volt);color:#01000a;font:700 10px var(--sans);letter-spacing:0;opacity:0;transition:opacity .15s}.open-hit:hover:after{opacity:1}.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font:11px var(--mono)}
.legend{position:absolute;z-index:12;left:18px;bottom:16px;display:flex;gap:16px;padding:9px 13px;border:1px solid #ffffff17;border-radius:10px;background:#1a1a18db;font:500 12px var(--sans);color:var(--muted)}.legend b{font-weight:500}.legend .working{color:var(--amber)}.legend .idle{color:#969b8e}.legend .blocked{color:var(--red)}.hint{position:absolute;right:18px;bottom:24px;color:#f0f0e85c;font:400 12px var(--sans)}
#modal{position:fixed;z-index:100;inset:0;background:#050605;display:none}#modal.open{display:block}#modal iframe{width:100%;height:100%;border:0}.modalbar{position:absolute;z-index:2;left:16px;right:16px;top:14px;height:44px;display:flex;align-items:center;gap:12px;padding:0 6px 0 14px;border:1px solid #ffffff17;border-radius:12px;background:#1a1a18f0;box-shadow:0 10px 40px #000b;font:500 12.5px var(--sans)}.modalname{font:500 12.5px var(--mono);color:var(--ink)}.close{margin-left:auto;height:32px;display:inline-flex;align-items:center;gap:8px;background:#ffffff0f;color:var(--ink);border:1px solid #ffffff1f;border-radius:9px;padding:0 12px;font:500 13px var(--sans);cursor:pointer}.close:hover{background:#ffffff1a}.close kbd{font:500 10px var(--mono);color:#f0f0e870;border:1px solid #ffffff24;border-radius:5px;padding:1px 5px}
@media(max-width:700px){.title{display:none}.meta{font-size:11px}.topbar{left:8px;right:8px;top:56px;max-width:none}.hint{display:none}.node{transform-origin:top left}.legend{left:8px;bottom:8px}}
/* ?stream=1 — an OBS overlay. Only the PAGE goes clear: the body and the canvas dot grid, and every piece of chrome is hidden. The terminal windows keep their own background and border — they should read as terminals floating on the stream, not as text on video. nav needs !important: its own rule is declared in a later stylesheet. */html.stream,html.stream body{background:transparent}html.stream #viewport{background-image:none;right:0}html.stream .topbar,html.stream .legend,html.stream .hint,html.stream #mp-version-badge{display:none}html.stream nav{display:none!important}</style><style>#modal{z-index:120}</style></head>
<body><div id="app"><div class="topbar"><div class="meta"><span class="live"><span class="dot"></span></span><span id="counts">connecting</span></div><span class="sep"></span><button class="tool" id="layout" title="How the agents are arranged under the Boss">Row</button><button class="tool icon" id="fit" title="Fit the fleet in view" aria-label="Fit the fleet in view"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button><button class="tool icon" id="center" title="Center on the Boss" aria-label="Center on the Boss"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3"/><path d="M12 19v3"/><path d="M2 12h3"/><path d="M19 12h3"/></svg></button><div class="zoom" id="zoom">100%</div></div>
<div id="viewport"><div id="world"><svg class="edges" id="edges"></svg><div id="nodes"></div></div></div></div>
<div id="modal"><div class="modalbar"><span class="live"><span class="dot"></span>Live</span><span class="modalname" id="modalname"></span><button class="close" id="close">Close <kbd>esc</kbd></button></div><iframe id="interactive" title="Interactive terminal" allow="clipboard-read; clipboard-write"></iframe></div>
<script>
"use strict";
// Tasks live on the Board; an old graph link to a task (/terminal-graph?task=ID) opens it there.
{const t=new URLSearchParams(location.search).get("task");if(t)location.replace("/?task="+encodeURIComponent(t))}
const viewport=document.getElementById("viewport"),world=document.getElementById("world"),nodesEl=document.getElementById("nodes"),edgesEl=document.getElementById("edges");
const LAYOUT_KEY="mp_terminal_graph_layout",LAYOUT_MODES=["row","grid","column"];
// ?layout=grid pins the arrangement from the URL: an OBS browser source has its own profile,
// so the button click that would normally be remembered never reaches it.
const LAYOUT_PARAM=new URLSearchParams(location.search).get("layout");
let layoutMode=LAYOUT_MODES.includes(LAYOUT_PARAM)?LAYOUT_PARAM:(LAYOUT_MODES.includes(localStorage.getItem(LAYOUT_KEY))?localStorage.getItem(LAYOUT_KEY):"row");
function layoutCols(n){return layoutMode==="column"?1:layoutMode==="grid"?Math.max(1,Math.ceil(Math.sqrt(n*1.4))):n}
const POSITION_KEY="mp_terminal_graph_positions_v2",TERMINAL_SCALE=.36,nodeEls=new Map(),positions=JSON.parse(localStorage.getItem(POSITION_KEY)||"{}");let graph={nodes:[],edges:[],layoutItems:[]},view={x:innerWidth/2,y:135,scale:.72},drag=null,pan=null,roPort=7682,rwPort=7681,uniformScale=TERMINAL_SCALE;
const esc=s=>String(s).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ttyUrl=(port,target)=>location.protocol==="https:"?`${port===roPort?"/ttyd-ro/":"/ttyd-rw/"}?arg=-t&arg=${encodeURIComponent(target)}`:`${location.protocol}//${location.hostname}:${port}/?arg=-t&arg=${encodeURIComponent(target)}`;
const api=(path,opts={})=>fetch(path,{credentials:"same-origin",...opts,headers:{"Content-Type":"application/json",...(opts.headers||{})}});
function applyView(){world.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.scale})`;document.getElementById("zoom").textContent=Math.round(view.scale*100)+"%"}
function savePositions(){const horizontal={};for(const id of nodeEls.keys()){const p=positions[id];if(p)horizontal[id]={x:p.x}}localStorage.setItem(POSITION_KEY,JSON.stringify(horizontal))}
function layoutId(item){return item.layout_id||item.agent_id}
function applyHierarchy(data){
 const byId=new Map(data.nodes.map(n=>[n.agent_id,n])),children=new Map(data.nodes.map(n=>[n.agent_id,[]])),parent=new Map();
 for(const e of data.edges)if(byId.has(e.from)&&byId.has(e.to)){children.get(e.from).push(e.to);parent.set(e.to,e.from)}
 for(const list of children.values())list.sort();
 const boss=data.nodes.find(n=>n.is_master),depth=new Map();
 if(boss){depth.set(boss.agent_id,0);const queue=[boss.agent_id];while(queue.length){const id=queue.shift(),d=depth.get(id);for(const child of children.get(id)||[])if(!depth.has(child)){depth.set(child,d+1);queue.push(child)}}}
 for(const n of data.nodes)if(!depth.has(n.agent_id)){let d=1,p=parent.get(n.agent_id),seen=new Set([n.agent_id]);while(p&&!seen.has(p)){seen.add(p);if(depth.has(p)){d=depth.get(p)+1;break}d++;p=parent.get(p)}depth.set(n.agent_id,d)}
 for(const n of data.nodes){n.kind="terminal";n.layout_id=n.agent_id;n.parent_id=n.boss_id;n.depth=depth.get(n.agent_id)||0}
 const items=[...data.nodes];data.layoutItems=items;const rows=new Map();
 for(const item of items){if(!rows.has(item.depth))rows.set(item.depth,[]);rows.get(item.depth).push(item)}
 let y=0;
 for(const d of [...rows.keys()].sort((a,b)=>a-b)){
  const row=rows.get(d);row.sort((a,b)=>{if(a.is_master)return-1;if(b.is_master)return 1;const ap=positions[a.parent_id],bp=positions[b.parent_id],ax=ap?ap.x+ap.width/2:0,bx=bp?bp.x+bp.width/2:0;return ax-bx||(a.kind===b.kind?layoutId(a).localeCompare(layoutId(b)):a.kind==="terminal"?-1:1)});
  const defaults=new Map(),extraY=new Map();let rowExtra=0;
  {
   // one boss with 28 agents on a single line is unreadable, so the row can wrap: the mode
   // picks how many columns, and extraY pushes the following depth clear of the block.
   const gap=80,cols=Math.max(1,Math.min(row.length,layoutCols(row.length)));
   if(cols>=row.length){const total=row.reduce((s,n)=>s+n.nodeW,0)+gap*Math.max(0,row.length-1);let cursor=-total/2;for(const item of row){defaults.set(layoutId(item),cursor);cursor+=item.nodeW+gap}}
   else{const w=Math.max(...row.map(n=>n.nodeW)),h=Math.max(...row.map(n=>n.nodeH)),vgap=90,total=cols*w+gap*(cols-1);
    row.forEach((item,i)=>{defaults.set(layoutId(item),-total/2+(i%cols)*(w+gap));extraY.set(layoutId(item),Math.floor(i/cols)*(h+vgap))});
    rowExtra=(Math.ceil(row.length/cols)-1)*(h+vgap)}
  }
  let useSaved=layoutMode==="row"&&row.every(n=>n.kind==="terminal"&&!n.is_master&&positions[n.agent_id]&&Number.isFinite(positions[n.agent_id].x));
  if(useSaved)for(let i=1;i<row.length;i++){const a=row[i-1],b=row[i];if(positions[b.agent_id].x<positions[a.agent_id].x+a.nodeW+40){useSaved=false;break}}
  for(const item of row){const id=layoutId(item),x=item.is_master?-item.nodeW/2:(useSaved?positions[id].x:defaults.get(id));positions[id]={x,y:y+(extraY.get(id)||0),depth:d,width:item.nodeW,height:item.nodeH}}
  y+=Math.max(...row.map(n=>n.nodeH))+120+rowExtra;
 }
}
function constrainedX(id,wanted){const p=positions[id],row=graph.layoutItems.filter(n=>n.depth===p.depth).sort((a,b)=>positions[layoutId(a)].x-positions[layoutId(b)].x),i=row.findIndex(n=>layoutId(n)===id),n=row[i];let min=-Infinity,max=Infinity;if(i>0){const prev=row[i-1],pp=positions[layoutId(prev)];min=pp.x+prev.nodeW+40}if(i<row.length-1){const next=row[i+1],np=positions[layoutId(next)];max=np.x-n.nodeW-40}return Math.max(min,Math.min(max,wanted))}
const STREAM=new URLSearchParams(location.search).get("stream")==="1";
if(STREAM)document.documentElement.classList.add("stream");
function makeNode(n,i){const el=document.createElement("article");el.className="node";el.dataset.id=n.agent_id;el.innerHTML=`<div class="chrome"><span class="lights"><i></i><i></i><i></i></span><span class="name"></span><span class="state"><span class="dot"></span><em></em></span></div><div class="screen"><div class="terminal-canvas"><iframe title="Live read-only terminal"></iframe></div><button class="open-hit" aria-label="Open interactive terminal full screen"></button></div>`;nodesEl.appendChild(el);nodeEls.set(n.agent_id,el);
 const header=el.querySelector(".chrome");header.addEventListener("pointerdown",e=>{e.stopPropagation();if(el.dataset.master==="true")return;header.setPointerCapture(e.pointerId);const p=positions[n.agent_id];drag={id:n.agent_id,sx:e.clientX,ox:p.x};el.classList.add("dragging")});header.addEventListener("pointermove",e=>{if(!drag||drag.id!==n.agent_id)return;positions[n.agent_id].x=constrainedX(n.agent_id,drag.ox+(e.clientX-drag.sx)/view.scale);placeNodes();drawEdges()});header.addEventListener("pointerup",()=>{drag=null;el.classList.remove("dragging");savePositions()});el.querySelector(".open-hit").onclick=()=>openTerminal(n.agent_id);return el}
function updateNode(el,n){el.dataset.state=n.state;el.dataset.master=n.is_master;el.dataset.depth=n.depth;el.querySelector(".name").innerHTML=n.is_master?'<span class="boss-tag">Boss</span>':esc(n.agent_id.split("/").pop().replace(/^main:/,""));el.querySelector(".name").title=n.agent_id;el.querySelector(".state em").textContent=n.state;el.style.width=n.nodeW+"px";el.style.height=n.nodeH+"px";const screen=el.querySelector(".screen"),frame=el.querySelector("iframe"),canvas=el.querySelector(".terminal-canvas");screen.style.width=n.screenW+"px";screen.style.height=n.screenH+"px";frame.style.width=n.frameW+"px";frame.style.height=n.frameH+"px";canvas.style.transform=`scale(${uniformScale})`;if(frame.dataset.target!==n.target){frame.dataset.target=n.target;frame.src=ttyUrl(roPort,n.target)}}
function reconcile(data){graph=data;roPort=data.readonly_port||7682;rwPort=data.interactive_port||7681;uniformScale=TERMINAL_SCALE;for(const n of data.nodes){/* ponytail: tile size is FIXED to a standard 160x48 terminal, not the live tmux cols/rows. Each tile attaches a real grouped tmux client (ttyd-attach.sh) and window-size defaults to `latest`, so deriving frameW from the polled cols fed a shrink loop: smaller frame -> ttyd measures fewer cols (~8px/col, not the assumed 6.25) -> window resizes smaller -> next poll smaller cols -> smaller frame, collapsing to the 480x260 floor = 60x15. Fixing the frame breaks the loop. Ceiling: tiles show a standard size, not each agent's real terminal. Upgrade path: give the read-only ttyd an ignore-size client (tmux attach -r / -f ignore-size) so previews never resize the window, then live cols can be shown safely. */n.frameW=1000;n.frameH=600;n.renderW=n.frameW*uniformScale;n.renderH=n.frameH*uniformScale;n.screenW=Math.ceil(n.renderW+8);n.screenH=Math.ceil(n.renderH+8);n.nodeW=n.screenW+14;n.nodeH=n.screenH+48}const wanted=new Set(data.nodes.map(n=>n.agent_id));for(const[id,el]of nodeEls)if(!wanted.has(id)){el.remove();nodeEls.delete(id);delete positions[id]}applyHierarchy(data);data.nodes.forEach((n,i)=>{const el=nodeEls.get(n.agent_id)||makeNode(n,i);updateNode(el,n)});savePositions();placeNodes();drawEdges();const working=data.nodes.filter(n=>n.state==="working").length;document.getElementById("counts").textContent=`${data.nodes.length} agents · ${working} working`}
function placeNodes(){for(const[id,el]of nodeEls){const p=positions[id];el.style.left=p.x+"px";el.style.top=p.y+"px"}}
function edgePath(e){const a=positions[e.from],b=positions[e.to];if(!a||!b)return;const sx=a.x+a.width/2,sy=a.y+a.height,ex=b.x+b.width/2,ey=b.y,mid=sy+(ey-sy)/2,p=document.createElementNS("http://www.w3.org/2000/svg","path");p.setAttribute("class","edge");p.setAttribute("d",`M ${sx} ${sy} C ${sx} ${mid}, ${ex} ${mid}, ${ex} ${ey}`);edgesEl.appendChild(p);if((graph.nodes.find(n=>n.agent_id===e.to)||{}).state==="working"){const flow=p.cloneNode();flow.setAttribute("class","edge edge-flow");edgesEl.appendChild(flow)}}
function drawEdges(){edgesEl.replaceChildren();for(const e of graph.edges)edgePath(e)}
let refreshReq=0;   // monotonic id: a late-arriving stale /todo/terminal-graph response must not clobber a newer one
let refreshBusy=false;
// The tiles come from /todo/terminal-graph; never let a tick start while the previous one is still in flight.
async function refresh(){if(refreshBusy)return;refreshBusy=true;const myReq=++refreshReq;try{const tr=await api("/todo/terminal-graph",{cache:"no-store"});if(myReq!==refreshReq)return;if(!tr.ok)throw Error(tr.status);reconcile(await tr.json());maybeFit()}catch(e){document.getElementById("counts").textContent="metadata offline · terminals stay connected"}finally{refreshBusy=false}}
function openTerminal(id){const n=graph.nodes.find(x=>x.agent_id===id);if(!n)return;document.getElementById("modalname").textContent=n.agent_id;document.getElementById("interactive").src=ttyUrl(rwPort,n.target);document.getElementById("modal").classList.add("open")}
function closeTerminal(){document.getElementById("modal").classList.remove("open");document.getElementById("interactive").src="about:blank"}document.getElementById("close").onclick=closeTerminal;addEventListener("keydown",e=>{if(e.key==="Escape"&&document.getElementById("modal").classList.contains("open"))closeTerminal()});
viewport.addEventListener("pointerdown",e=>{if(e.target!==viewport)return;viewport.setPointerCapture(e.pointerId);pan={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};viewport.classList.add("panning")});viewport.addEventListener("pointermove",e=>{if(!pan)return;view.x=pan.vx+e.clientX-pan.x;view.y=pan.vy+e.clientY-pan.y;applyView()});viewport.addEventListener("pointerup",()=>{pan=null;viewport.classList.remove("panning")});viewport.addEventListener("wheel",e=>{e.preventDefault();const old=view.scale,next=Math.max(.2,Math.min(1.35,old*Math.exp(-e.deltaY*.001)));view.x=e.clientX-(e.clientX-view.x)*next/old;view.y=e.clientY-(e.clientY-view.y)*next/old;view.scale=next;applyView()},{passive:false});
// ?fit=1 keeps the whole fleet in frame without anyone to press FIT FLEET — an OBS browser
// source has no one to click it, and the fleet changes size as agents come and go. Refit only
// when the shape actually changes, so it never fights a hand pan on a normal page.
const AUTOFIT=new URLSearchParams(location.search).get("fit")==="1";let fitKey="";
function maybeFit(){if(!AUTOFIT)return;const k=graph.layoutItems.length+"|"+layoutMode+"|"+viewport.clientWidth+"x"+viewport.clientHeight;if(k===fitKey)return;fitKey=k;document.getElementById("fit").onclick()}
addEventListener("resize",()=>{if(AUTOFIT){fitKey="";maybeFit()}});
function paintLayoutButton(){document.getElementById("layout").textContent=layoutMode[0].toUpperCase()+layoutMode.slice(1)}
// cycling drops the saved drag positions for terminals: a hand-placed x from the old
// arrangement would pin a tile outside the new one.
document.getElementById("layout").onclick=()=>{layoutMode=LAYOUT_MODES[(LAYOUT_MODES.indexOf(layoutMode)+1)%LAYOUT_MODES.length];localStorage.setItem(LAYOUT_KEY,layoutMode);for(const id of nodeEls.keys())delete positions[id];savePositions();paintLayoutButton();refresh();document.getElementById("fit").onclick()};
paintLayoutButton();
document.getElementById("center").onclick=()=>{view={x:viewport.clientWidth/2,y:135,scale:.72};applyView()};document.getElementById("fit").onclick=()=>{const ps=graph.layoutItems.map(n=>positions[layoutId(n)]).filter(Boolean);if(!ps.length)return;const minX=Math.min(...ps.map(p=>p.x)),maxX=Math.max(...ps.map(p=>p.x+p.width)),minY=Math.min(...ps.map(p=>p.y)),maxY=Math.max(...ps.map(p=>p.y+p.height)),s=Math.min((viewport.clientWidth-80)/(maxX-minX),(innerHeight-175)/(maxY-minY),1);view.scale=Math.max(.2,s);view.x=(viewport.clientWidth-(minX+maxX)*view.scale)/2;view.y=125-minY*view.scale;applyView()};
applyView();refresh();setInterval(refresh,2000);
</script></body></html>
