<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyPlow - Priorities</title>
<style>
:root{
  --midnight:#01000A; --volt:#D5EF8A; --grove:#5e7a5e; --iris:#C4BFFF;
  --dark-bg:#111110; --text-dark:#F0F0E8; --muted-dark:rgba(240,240,232,0.45);
  --surface:rgba(255,255,255,0.05); --surface2:rgba(255,255,255,0.08);
  --dark-border:rgba(255,255,255,0.09); --border2:rgba(255,255,255,0.15);
  --volt-dim:rgba(213,239,138,0.15); --volt-glow:rgba(213,239,138,0.25);
  --success:#34c759; --danger:#ff3b30; --warning:#febc2e; --info:#5ac8fa;
  --serif:'Instrument Serif',Georgia,serif;
  --sans:'DM Sans',system-ui,sans-serif;
  --mono:'DM Mono','SF Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--dark-bg);color:var(--text-dark);font-family:var(--sans);}
body.modal-open{overflow:hidden;}
.grain{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:0.035;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");}
/* No title row (CEO c6a13ce248): the add bar starts just under the fixed Board/Graph nav, and on
   screens wide enough for the nav to sit in the side gutter it starts at the very top. */
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:62px 22px 80px;}
@media (min-width:1420px){.wrap{padding-top:22px;}}
.subt{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-dark);margin-top:4px;}
.navlink{color:var(--volt);text-decoration:none;text-transform:uppercase;}
.navlink:focus-visible{outline:2px solid var(--volt);outline-offset:3px;border-radius:2px;}
.addbar{display:flex;gap:10px;margin:0 0 16px;}
#addInput{flex:1;font-family:var(--sans);font-size:18px;background:var(--surface);border:1px solid var(--dark-border);border-radius:14px;padding:16px 20px;color:var(--text-dark);}
#addInput::placeholder{color:var(--muted-dark);}
.searchbar{display:none;gap:12px;align-items:center;margin:0 0 14px;}
.searchbar.on{display:flex;}
#search{flex:1;font-family:var(--sans);font-size:16px;background:var(--surface);border:1px solid var(--dark-border);border-radius:12px;padding:11px 16px;color:var(--text-dark);}
#search::placeholder{color:var(--muted-dark);}
#searchN{margin-top:0;white-space:nowrap;}
.no-match{list-style:none;padding:18px 4px;color:var(--muted-dark);font-family:var(--mono);font-size:13px;}
.btn-volt{background:var(--volt);color:var(--midnight);border:none;border-radius:14px;font-family:var(--sans);font-size:17px;font-weight:700;padding:0 22px;cursor:pointer;}
.btn-volt:hover{box-shadow:0 0 0 3px var(--volt-glow);}
.vb-label{font-family:var(--mono);font-size:10px;text-transform:uppercase;color:var(--muted-dark);}
.st-working{color:rgb(254,188,46);background:rgba(254,188,46,0.18);}
.st-review{color:rgb(90,200,250);background:rgba(90,200,250,0.16);}
.st-blocked{color:rgb(255,59,48);background:rgba(255,59,48,0.16);}
.st-done{color:rgb(82,216,115);background:rgba(52,199,89,0.16);}
.st-cancelled{color:var(--muted-dark);background:rgba(142,142,147,0.18);}
.st-recurring{color:var(--iris);background:rgba(196,191,255,0.12);}
.vb-sep{width:1px;height:18px;background:rgba(255,255,255,0.09);margin:0 4px;}
.vbtn{font-family:var(--mono);font-size:11px;border-radius:9px;background:rgba(255,255,255,0.05);border:1px solid var(--dark-border);color:var(--muted-dark);text-transform:uppercase;padding:5px 10px;cursor:pointer;}
.vbtn.active{color:var(--midnight);background:var(--volt);border-color:var(--volt);}
.vbtn:disabled{opacity:.3;cursor:not-allowed;}
.bossbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:18px;}
.boss-state{font-family:var(--mono);font-size:11px;border-radius:100px;text-transform:uppercase;font-weight:500;padding:4px 11px;}
.boss-state.up{color:rgb(82,216,115);background:rgba(52,199,89,0.16);}
.boss-state.down{color:rgb(255,59,48);background:rgba(255,59,48,0.16);}
.boss-kill{color:var(--danger);border-color:rgba(255,59,48,0.4);}
.boss-kill:hover:not(:disabled){background:rgba(255,59,48,0.16);}
.boss-msg{margin-top:0;text-transform:none;}
ul#list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;}
li.task{background:var(--surface);border:1px solid var(--dark-border);border-radius:18px;padding:16px 18px;cursor:pointer;}
li.task.done .task-text{text-decoration:line-through;color:var(--muted-dark);}
li.task.boss-chat{border-color:var(--volt);}
.task-top{display:flex;gap:14px;align-items:flex-start;}
.check{width:38px;height:38px;border-radius:11px;border:2px solid var(--border2);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;color:#fff;font-size:20px;}
.check:hover{border-color:var(--volt);}
.check.on{background:var(--success);border-color:var(--success);}
.check.disabled{opacity:.3;cursor:not-allowed;}
.task-main{flex:1;min-width:0;}
/* clamp preview titles to 2 lines so a giant title can't blow out the homepage list; full title is in the card modal */
.task-text{font-family:var(--serif);font-size:22px;line-height:1.2;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;max-height:2.6em;word-break:break-word;overflow-wrap:anywhere;}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;}
.badge{font-family:var(--mono);font-size:10px;border-radius:100px;text-transform:uppercase;padding:3px 9px;}
.unread-badge{background:var(--volt);color:var(--midnight);border-radius:100px;font-family:var(--mono);font-size:10px;padding:2px 7px;font-weight:700;}
.tag{font-family:var(--mono);font-size:10px;color:var(--muted-dark);}
.asg-link{color:var(--iris);text-decoration:none;}
.ver{color:rgb(82,216,115);}
.ping{font-family:var(--mono);font-size:10px;color:var(--muted-dark);}
.star{margin-left:auto;font-size:20px;color:var(--muted-dark);cursor:pointer;background:none;border:none;flex:0 0 auto;}
.star.on{color:var(--volt);}
/* modal */
#modalbg{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:50;display:none;align-items:center;justify-content:center;}
body.modal-open #modalbg{display:flex;}
#modal{width:min(1400px,88vw);height:88vh;background:var(--dark-bg);border:1px solid var(--border2);border-radius:20px;display:flex;flex-direction:column;overflow:hidden;}
.m-head{padding:18px 22px;border-bottom:1px solid var(--dark-border);display:flex;align-items:flex-start;gap:12px;}
.m-title-wrap{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
.m-title{font-family:var(--serif);font-size:26px;word-break:break-word;overflow-wrap:anywhere;}
/* clamp a giant multi-paragraph title so it can never push the comment thread off-screen */
.m-title.clamped{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;max-height:3.9em;}
.m-title.expanded{max-height:40vh;overflow-y:auto;overscroll-behavior:contain;}
.m-title-more{align-self:flex-start;background:none;border:none;color:var(--iris);cursor:pointer;font-family:var(--mono);font-size:12px;padding:0;}
.m-close{background:none;border:none;color:var(--text-dark);font-size:24px;cursor:pointer;}
.m-row{padding:10px 22px;border-bottom:1px solid var(--dark-border);display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--muted-dark);}
.m-row select{background:var(--surface);color:var(--text-dark);border:1px solid var(--dark-border);border-radius:8px;padding:5px 8px;font-family:var(--mono);}
.inline-field{background:var(--surface);color:var(--text-dark);border:1px solid var(--dark-border);border-radius:8px;padding:5px 8px;font-family:var(--sans);min-width:150px;}
.btn-del{background:rgba(255,59,48,0.14);color:var(--danger);border:1px solid rgba(255,59,48,0.4);border-radius:9px;padding:5px 12px;cursor:pointer;font-family:var(--mono);font-size:12px;}
.thread{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:16px 22px;min-height:360px;position:relative;}
.ev{display:flex;gap:13px;padding:15px 2px;border-bottom:1px solid var(--dark-border);}
.av{width:34px;height:34px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;color:var(--iris);flex:0 0 auto;}
.ev-body{flex:1;min-width:0;}
.ev-head{font-family:var(--mono);font-size:12.5px;color:var(--muted-dark);margin-bottom:4px;}
.ev-ago{margin-left:8px;}
.ev-text{font-size:18px;line-height:1.6;white-space:pre-wrap;word-break:break-word;}
.ev-text img,.ev-text video{max-width:100%;max-height:340px;border-radius:10px;display:block;margin-top:6px;}
.composer{padding:14px 22px;border-top:1px solid var(--dark-border);display:flex;gap:10px;}
#composer{flex:1;font-family:var(--sans);font-size:18px;background:var(--surface);border:1px solid var(--dark-border);border-radius:12px;padding:12px 14px;color:var(--text-dark);resize:vertical;min-height:44px;}
.jump{position:absolute;right:30px;bottom:88px;width:38px;height:38px;border-radius:50%;background:var(--volt);color:var(--midnight);border:none;font-size:18px;cursor:pointer;display:none;z-index:5;}
.jump.show{display:block;}
.proofregion{}
.proof-broken{border:1px solid #a33;border-radius:8px;padding:10px 12px;background:rgba(170,51,51,.08);font-family:var(--sans);font-size:13px;line-height:1.5;}
.proof-broken b{display:block;margin-bottom:4px;}
.proof-broken code{font-family:var(--mono,monospace);font-size:12px;word-break:break-all;opacity:.85;}
/* mobile: fill the screen and track the visual viewport (--vvh) so the on-screen keyboard never hides the composer */
@media (max-width:640px){
  #modalbg{align-items:flex-start;justify-content:flex-start;}
  #modal{position:fixed;left:0;top:var(--vvtop,0);width:100vw;height:var(--vvh,100dvh);max-height:none;border-radius:0;border:0;}
  .thread{min-height:0;padding:14px 16px;}   /* min-height:0 lets the thread shrink so the composer stays pinned above the keyboard; tighter sides = wider text column */
  .m-head{padding:56px 16px 14px;}   /* 56px top clears the fixed Board/Graph nav floating over the full-screen modal; tighter sides */
  /* smaller, denser type so long comment threads read comfortably on a phone (CEO 302dae6fb9) */
  .task-text{font-size:17px;}
  .m-title{font-size:19px;}
  .m-row{padding:10px 16px;}
  .ev{gap:10px;padding:11px 2px;}
  .av{width:28px;height:28px;font-size:11px;}
  .ev-text{font-size:15px;line-height:1.45;}
  .composer{padding:12px 16px;}   /* #composer stays 18px (>=16px) so iOS never tap-zooms */
}
</style>
</head>
<body>
<div class="grain"></div>
<div class="wrap">
  <div class="addbar">
    <input id="addInput" placeholder="Add a priority and hit Enter…" autocomplete="off">
    <button class="btn-volt" id="addBtn">Add</button>
  </div>
  <div class="bossbar" id="bossbar">
    <span class="vb-label">boss</span>
    <span class="boss-state" id="bossState">…</span>
    <button class="vbtn boss-kill" id="bossKill">Kill Boss</button>
    <span class="vb-sep"></span>
    <button class="vbtn" id="bossRevive" title="Bring the SAME Boss back, resuming its session and memory">Revive</button>
    <span class="vb-sep"></span>
    <span class="vb-label">spawn new</span>
    <button class="vbtn" id="bossSpawnClaude">Claude</button>
    <button class="vbtn" id="bossSpawnCodex">Codex</button>
    <button class="vbtn" id="bossSpawnGrok">Grok</button>
    <span class="vb-sep"></span>
    <button class="vbtn" data-toggle="done">show done</button>
    <button class="vbtn" data-toggle="cancelled">show cancelled</button>
    <button class="vbtn" data-lens="recurring">recurring · <span id="recurN">0</span></button>
    <span class="boss-msg subt" id="bossMsg"></span>
  </div>
  <div class="searchbar" id="searchbar">
    <input id="search" type="search" placeholder="Filter tasks by title, owner or id…  (Esc to clear)" autocomplete="off" spellcheck="false">
    <span class="subt" id="searchN"></span>
  </div>
  <ul id="list"></ul>
</div>

<div id="modalbg"><div id="modal"></div></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
let BOARD = {tasks:{},order:[],pinSeq:0};
let AGENTS = {};      // agent_id -> attach_url
let openTaskId = null;
let boardSig = "";
let boardReq = 0;     // monotonic id: a late-arriving stale /todo/board response must not clobber a newer one
let boardFetchInFlight = null; // the 10 MB board can take >3s; never supersede every response with overlapping polls
let BUILD = null;
let stickBottom = true;
let lastProg = 0;
const READ_KEY="mp_read_tasks";
let readTasks=JSON.parse(localStorage.getItem(READ_KEY)||"{}");

// filters (persisted)
// working/review/blocked are always on — that IS the board. Done and cancelled are opt-in.
let showDone = localStorage.getItem("mp_show_done")==="1";
let showCancelled = localStorage.getItem("mp_show_cancelled")==="1";
let lens = localStorage.getItem("mp_lens") || "";   // "" | "recurring"

function saveFilters(){ localStorage.setItem("mp_show_done", showDone?"1":"0");
  localStorage.setItem("mp_show_cancelled", showCancelled?"1":"0");
  localStorage.setItem("mp_lens", lens); }

async function api(path, opts){ opts=opts||{}; opts.credentials="same-origin";
  opts.headers=Object.assign({"Content-Type":"application/json"}, opts.headers||{});
  return fetch(path, opts); }

async function openAgent(agent, ev){
  if(ev){ ev.preventDefault(); ev.stopPropagation(); }
  try{
    const r=await api("/todo/attach?agent="+encodeURIComponent(agent));
    if(!r.ok) return;
    const d=await r.json();
    let base=d.base||"";
    let host="";
    try{ host=new URL(base).hostname; }catch(e){}
    if(!base || ["0.0.0.0","127.0.0.1","localhost","::"].includes(host)){
      base=location.protocol+"//"+location.hostname+":"+(d.port||Number("__TTYD_PORT__"));
    }
    window.open(base.replace(/\/$/,"")+"/?arg=-t&arg="+encodeURIComponent(d.target),"_blank");
  }catch(e){}
}
function appendAgentLink(parent,agent){
  if(!agent){ parent.appendChild(document.createTextNode("unassigned")); return; }
  const a=document.createElement("a"); a.className="asg-link"; a.href="#"; a.textContent=agent;
  a.addEventListener("click",e=>openAgent(agent,e)); parent.appendChild(a);
}

// Replace a media proof that failed to load with a visible reason, so a broken proof is
// never mistaken for a missing one. file:// is the usual culprit: the board is served over
// http and the browser refuses to reach the filesystem.
function failedProof(el,url){
  const box=document.createElement("div"); box.className="proof-broken";
  const t=document.createElement("b");
  t.textContent=(url||"").startsWith("file://")
    ? "Proof cannot load: file:// is not reachable from the board"
    : "Proof cannot load";
  const c=document.createElement("code"); c.textContent=url||"(no url)";
  const h=document.createElement("div");
  h.textContent="Re-attach by uploading the file: mp proof <task_id> <path> [note]";
  box.appendChild(t); box.appendChild(c); box.appendChild(h);
  if(el.parentNode) el.parentNode.replaceChild(box,el);
}

function relTime(ts){
  if(ts==null) return "";
  let ms = Number(ts); if(!isFinite(ms)) return "";
  if(ms < 1e12) ms = ms*1000;         // seconds -> ms
  let d = (Date.now()-ms)/1000;
  if(d<0) d=0;
  if(d<45) return "just now";
  if(d<3600) return Math.round(d/60)+"m ago";
  if(d<86400) return Math.round(d/3600)+"h ago";
  return Math.round(d/86400)+"d ago";
}
// "14m ago" is computed once, when a comment is drawn, and the board only redraws when the data
// changes -- so a thread left open kept its old labels until a new message or a reopen. Every label
// carries its timestamp; this refreshes them in place, without redrawing anything.
function refreshRelTimes(){ for(const e of document.querySelectorAll(".ev-ago[data-ts]")){ const t=relTime(e.dataset.ts); if(e.textContent!==t) e.textContent=t; } }
function initials(name){ if(!name) return "?"; name=String(name);
  if(name==="CEO") return "CEO";
  let base = name.split("/").pop(); return base.slice(0,2).toUpperCase(); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function stateLabel(s){ return s==="review"?"review (CEO)":(s||"").replace(/_/g," "); }
function latestAgentComment(task){
  return Math.max(0,...(task.comments||[]).filter(c=>c.by!=="CEO").map(c=>{let n=Number(c.ts)||0;return n<1e12?n*1000:n;}));
}
function hasUnread(task){ return Number(task.unread||0)>0 && latestAgentComment(task)>Number(readTasks[task.id]||0); }
async function patchTask(id, fields){
  await api("/todo/update",{method:"POST",body:JSON.stringify(Object.assign({op:"set",id:id},fields))});
  fetchBoard(true);
}

function wireInlineText(el, task){
  el.title="Double-click to edit";
  el.addEventListener("dblclick",e=>{ e.preventDefault(); e.stopPropagation();
    el.contentEditable="true"; el.focus(); document.execCommand&&document.execCommand("selectAll",false,null); });
  el.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); el.blur(); } if(e.key==="Escape"){el.textContent=task.text;el.blur();} });
  el.addEventListener("blur",()=>{ if(el.contentEditable==="true"){
    el.contentEditable="false"; const v=el.textContent.trim(); if(v && v!==task.text) patchTask(task.id,{text:v});
  }});
}

function orderedTasks(){
  const t=BOARD.tasks||{};
  // The Boss chat card (card 3303b00b4c) sits above everything, pins included.
  const boss = Object.values(t).find(x=>x.bossChat);
  const pins = Object.values(t).filter(x=>x.pinned && !x.bossChat).sort((a,b)=>(a.pinRank||0)-(b.pinRank||0));
  const normal = (BOARD.order||[]).map(id=>t[id]).filter(x=>x && !x.pinned && !x.bossChat);
  return {boss, pins, normal};
}
// Cmd/Ctrl+F filter. Every word must appear (AND), matched against the same fields the Graph's
// search uses: id, title and owner.
let query="";
function matches(task){
  const hay=(task.id+" "+(task.text||"")+" "+(task.assignee||"")).toLowerCase();
  return query.split(/\s+/).filter(Boolean).every(w=>hay.includes(w));
}
// Active cards always sit above done and cancelled ones -- in a search, and with "show done" or
// "show cancelled" on. The sort is stable, so each group keeps its own pins-first, board order.
function activeFirst(tasks){
  const finished=t=>t.state==="done"||t.state==="cancelled";
  return tasks.slice().sort((a,b)=>finished(a)-finished(b));
}
function visible(task){
  if(query) return matches(task);
  if(lens==="recurring") return task.state==="recurring";
  if(task.state==="recurring") return false;           // recurring never on working board
  if(task.state==="done" && !showDone) return false;
  if(task.state==="cancelled" && !showCancelled) return false;
  return true;
}

function cardEl(task){
  const li=document.createElement("li"); li.className="task"+(task.state==="done"?" done":"");
  li.dataset.id=task.id;
  const check=document.createElement("div");
  check.className="check"+(task.state==="done"?" on":"");
  check.textContent = task.state==="done"?"✓":"";
  check.title = task.state==="done"?"mark not-done":"mark done";
  check.addEventListener("click", async e=>{ e.stopPropagation();
    const done = task.state==="done";
    await api("/todo/status",{method:"POST",body:JSON.stringify(
      {task_id:task.id, state: done?"working":"done", verified: !done, by:"CEO"})});
    fetchBoard(true);
  });
  const main=document.createElement("div"); main.className="task-main";
  const txt=document.createElement("div"); txt.className="task-text"; txt.textContent=task.text||"(untitled)";
  wireInlineText(txt,task);
  const meta=document.createElement("div"); meta.className="meta";
  if(task.bossChat){   // a conversation, not a task: no done check, no pin, no owner
    li.classList.add("boss-chat"); txt.textContent="💬 "+(task.text||"Boss");
    const sub=document.createElement("span"); sub.className="tag"; sub.textContent="chat with the Boss"; meta.appendChild(sub);
    if(hasUnread(task)){ const u=document.createElement("span"); u.className="unread-badge"; u.textContent=task.unread; meta.appendChild(u); }
    main.appendChild(txt); main.appendChild(meta);
    const top=document.createElement("div"); top.className="task-top"; top.appendChild(main); li.appendChild(top);
    li.addEventListener("click", ()=>openCard(task.id));
    return li;
  }
  const badge=document.createElement("span"); badge.className="badge st-"+task.state; badge.textContent=stateLabel(task.state);
  meta.appendChild(badge);
  if(hasUnread(task)){ const u=document.createElement("span"); u.className="unread-badge"; u.textContent=task.unread; meta.appendChild(u); }
  const asg=document.createElement(task.assignee && task.assignee.includes(":")?"a":"span");
  asg.className="tag asg-tag"+(task.assignee&&task.assignee.includes(":")?" asg-link":"");
  asg.textContent = task.assignee? ("@"+task.assignee.split("/").pop()) : "unassigned";
  if(task.assignee && task.assignee.includes(":")){
    asg.href = "#";
    asg.target="_blank";
    asg.addEventListener("click", e=>openAgent(task.assignee,e));
  }
  meta.appendChild(asg);
  if(task.verified){ const v=document.createElement("span"); v.className="badge st-done ver"; v.textContent="verified"; meta.appendChild(v); }
  if(task.pingsToBoss>0){ const pg=document.createElement("span"); pg.className="ping"; pg.textContent="↑boss "+task.pingsToBoss; meta.appendChild(pg); }

  const star=document.createElement("button"); star.className="star"+(task.pinned?" on":"");
  star.textContent = task.pinned?"★":"☆"; star.title="pin";

function render(){
  const list=$("#list"); list.innerHTML="";
  const {boss, pins, normal}=orderedTasks();
  const shown=[...(boss && (!query || matches(boss)) ? [boss] : []),
               ...activeFirst([...pins.filter(visible), ...normal.filter(visible)])];
  shown.forEach(t=>list.appendChild(cardEl(t)));
  const n=shown.length;
  $("#searchN").textContent = query ? n+(n===1?" match":" matches") : "";
  if(query && !n){ const li=document.createElement("li"); li.className="no-match"; li.textContent="No task matches “"+query+"”"; list.appendChild(li); }

  $("[data-toggle='cancelled']").classList.toggle("active", showCancelled);
  document.querySelectorAll("[data-lens]").forEach(b=>b.classList.toggle("active", b.dataset.lens===lens));

// ---- modal ----
function timeline(task){
  const items=[];
  (task.comments||[]).forEach(c=>items.push({kind:"comment", by:c.by, body:c.body, ts:c.ts}));
  (task.proofs||[]).forEach(p=>items.push({kind:"proof", pkind:p.kind, url:p.url, body:p.body, score:p.score, keep:p.keep, note:p.note, by:"proof", ts:p.ts}));
  // ts come in mixed units (server writes seconds, older/agent items are ms); normalize the
  // SAME way relTime() does (seconds->ms) so a freshly posted comment sorts to the bottom, not
  // into the middle of the thread. Without this, a new comment "disappears" mid-thread on long cards.
  const tsMs=v=>{ let n=Number(v)||0; return n<1e12 ? n*1000 : n; };
  items.sort((a,b)=>tsMs(a.ts)-tsMs(b.ts));
  return items;
}

function evEl(it){
  const ev=document.createElement("div"); ev.className="ev";
  const av=document.createElement("div"); av.className="av"; av.textContent=initials(it.by);
  const b=document.createElement("div"); b.className="ev-body";
  const h=document.createElement("div"); h.className="ev-head";
  const label=it.by==="proof"?"proof":it.by;
  if(label && label.includes("/") && label.includes(":")){
    const a=document.createElement("a"); a.className="asg-link"; a.href="#"; a.textContent=label;
    a.addEventListener("click",e=>openAgent(label,e)); h.appendChild(a);
  } else { h.appendChild(document.createTextNode(label||"")); }
  const ago=document.createElement("span"); ago.className="ev-ago"; ago.dataset.ts=it.ts; ago.textContent=relTime(it.ts); h.appendChild(ago);
  const txt=document.createElement("div"); txt.className="ev-text";
  try{
    if(it.kind==="proof"){
      // A proof that cannot load must say so. Silently showing nothing reads as "no proof".
      if(it.pkind==="image"){ const im=document.createElement("img"); im.alt="image proof"; im.onerror=()=>failedProof(im,it.url); im.src=it.url; txt.appendChild(im); }
      else if(it.pkind==="video"){ const v=document.createElement("video"); v.controls=true; v.onerror=()=>failedProof(v,it.url); v.src=it.url; txt.appendChild(v); }
      else if(it.pkind==="link"){ const a=document.createElement("a"); a.href=it.url; a.textContent=it.url; a.target="_blank"; txt.appendChild(a); }
      else { txt.textContent=it.body||it.url||"(proof)"; }
    } else { renderMarkdown(txt,it.body||""); }
  }catch(e){ txt.textContent="(unrenderable)"; }
  b.appendChild(h); b.appendChild(txt); ev.appendChild(av); ev.appendChild(b);
  return ev;
}
function progScroll(el){ lastProg=Date.now(); el.scrollTop=el.scrollHeight; }
function renderModal(task, forceBottom){
  const m=$("#modal");
  const sig = JSON.stringify([task.text,task.doneCondition,task.assignee,task.state,
    timeline(task).map(i=>[i.ts,i.body,i.url])]);
  if(m.dataset.sig===sig && !forceBottom) return;   // change-guard: don't rebuild if unchanged
  // preserve an in-progress composer draft (+caret/focus) across the rebuild so a background poll can't wipe what the CEO is typing
  const oldTa=m.querySelector("#composer");
  const draft = oldTa ? oldTa.value : null;
  const draftFocused = oldTa && document.activeElement===oldTa;
  const selStart = oldTa ? oldTa.selectionStart : null, selEnd = oldTa ? oldTa.selectionEnd : null;
  const thread = m.querySelector(".thread");
  let wasAtBottom=true, prevTop=0;
  if(thread){ prevTop=thread.scrollTop; wasAtBottom = (thread.scrollHeight-thread.scrollTop-thread.clientHeight) < 24; }
  m.dataset.sig=sig;
  m.innerHTML="";
  const head=document.createElement("div"); head.className="m-head";
  const titleWrap=document.createElement("div"); titleWrap.className="m-title-wrap";
  const ti=document.createElement("div"); ti.className="m-title clamped"; ti.textContent=task.text||"(untitled)";
  wireInlineText(ti,task);
  ti.title=task.text||"";   // full title on hover as a fallback
  const more=document.createElement("button"); more.className="m-title-more"; more.textContent="show more"; more.style.display="none";
  more.onclick=()=>{ const clamped=ti.classList.toggle("clamped"); ti.classList.toggle("expanded", !clamped); more.textContent=clamped?"show more":"show less"; };
  titleWrap.appendChild(ti); titleWrap.appendChild(more);
  const cl=document.createElement("button"); cl.className="m-close"; cl.textContent="✕"; cl.onclick=closeCard;
  head.appendChild(titleWrap); head.appendChild(cl);
  const row=document.createElement("div"); row.className="m-row";
  row.appendChild(document.createTextNode("done-condition: "));
  const dc=document.createElement("input"); dc.className="inline-field"; dc.value=task.doneCondition||""; dc.placeholder="done condition";
  dc.addEventListener("change",()=>patchTask(task.id,{doneCondition:dc.value})); row.appendChild(dc);
  row.appendChild(document.createTextNode("  ·  assignee: "));
  const owner=document.createElement("span"); appendAgentLink(owner,task.assignee); row.appendChild(owner);
  row.appendChild(document.createTextNode("  ·  "));
  const sel=document.createElement("select");
  ["working","review","done","blocked","cancelled","recurring"].forEach(s=>{
    const o=document.createElement("option"); o.value=s; o.textContent=stateLabel(s); if(task.state===s)o.selected=true; sel.appendChild(o);});
  sel.onchange=async ()=>{ await api("/todo/status",{method:"POST",body:JSON.stringify({task_id:task.id,state:sel.value})}); fetchBoard(true); };
  row.appendChild(sel);
  const del=document.createElement("button"); del.className="btn-del"; del.textContent="Delete task";
  del.onclick=async ()=>{ if(!confirm("Delete this task?"))return;
    await api("/todo/update",{method:"POST",body:JSON.stringify({op:"del",id:task.id})});
    closeCard(); fetchBoard(true); };
  row.appendChild(del);
  const ownerHistory=document.createElement("div"); ownerHistory.className="m-row owner-history";
  ownerHistory.appendChild(document.createTextNode("owner history: "));
  (task.ownerHistory||[]).forEach((it,i)=>{if(i)ownerHistory.appendChild(document.createTextNode(" · "));
    const txt=document.createElement("span"); txt.appendChild(document.createTextNode((it.action||"owner")+" "));
    appendAgentLink(txt,it.agent_id||it.previous); if(it.previous){txt.appendChild(document.createTextNode(" from "));appendAgentLink(txt,it.previous);} ownerHistory.appendChild(txt);});
  const thr=document.createElement("div"); thr.className="thread";
  timeline(task).forEach(it=>thr.appendChild(evEl(it)));
  const jump=document.createElement("button"); jump.className="jump"; jump.textContent="↓";
  jump.onclick=()=>{ stickBottom=true; thr.scrollTo({top:thr.scrollHeight,behavior:"smooth"}); };
  thr.appendChild(jump);
  const comp=document.createElement("div"); comp.className="composer";
  const ta=document.createElement("textarea"); ta.id="composer"; ta.placeholder=task.bossChat?"Message the Boss…":"Write a comment…";
  if(draft!==null) ta.value=draft;   // restore the draft the CEO was typing before this rebuild
  const send=document.createElement("button"); send.className="btn-volt"; send.textContent="Send";
  const post=async ()=>{ const v=ta.value.trim(); if(!v)return; ta.value="";
    await api("/todo/comment",{method:"POST",body:JSON.stringify({task_id:task.id,body:v,by:"CEO"})});
    stickBottom=true; fetchBoard(true); };
  send.onclick=post;
  ta.addEventListener("keydown",e=>{ if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)){ e.preventDefault(); post(); }});
  comp.appendChild(ta); comp.appendChild(send);
  m.appendChild(head); if(!task.bossChat){ m.appendChild(row); m.appendChild(ownerHistory); } m.appendChild(thr); m.appendChild(comp);
  if(draftFocused){ ta.focus(); try{ ta.setSelectionRange(selStart,selEnd); }catch(e){} }   // keep the CEO's cursor where it was
  // reveal the show-more toggle only when the clamped title actually overflows its 3-line box
  requestAnimationFrame(()=>{ if(ti.classList.contains("clamped") && ti.scrollHeight-ti.clientHeight>2){ more.style.display="block"; } });

  thr.addEventListener("scroll",()=>{
    if(Date.now()-lastProg < 250) return;             // ignore layout-induced scrolls after a prog pin
    const atBottom=(thr.scrollHeight-thr.scrollTop-thr.clientHeight)<24;
    stickBottom = atBottom;
    jump.classList.toggle("show", !atBottom);
  });
  // restore / pin scroll — pin to bottom on explicit force OR when the thread is "sticky"
  // (post() sets stickBottom=true so a freshly-posted comment scrolls into view even from mid-thread;
  //  the scroll listener clears stickBottom when the user scrolls up, so background polls won't yank them down)
  if(forceBottom || stickBottom){
    stickBottom=true;
    requestAnimationFrame(()=>requestAnimationFrame(()=>progScroll(thr)));
    [40,150,400,900,1800,3000].forEach(ms=>setTimeout(()=>{ if(stickBottom) progScroll(thr); }, ms));
    thr.querySelectorAll("img,video").forEach(el=>el.addEventListener("load",()=>{ if(stickBottom) progScroll(thr); }));
    thr.querySelectorAll("video").forEach(el=>el.addEventListener("loadeddata",()=>{ if(stickBottom) progScroll(thr); }));
  } else if(wasAtBottom){ progScroll(thr); }
  else { thr.scrollTop=prevTop; }
}
function openCard(id, fromHistory){

async function loadAgents(){
  try{ const r=await api("/agents"); if(r.ok){ const a=await r.json();
    AGENTS={}; a.forEach(x=>{ if(x.attach_url) AGENTS[x.agent_id]=x.attach_url; });
    renderBoss(a.find(x=>x.is_master && x.state==="alive")||null);
    if(Object.keys(BOARD.tasks||{}).length) render();   // refresh assignee links once attach URLs known
  } }catch(e){}
}

// ---- Boss lifecycle controls (card 0cc0bde980) ----
// State rides the existing /agents poll; no extra poller. Kill and spawn are mutually exclusive by
// construction — you can only spawn a Boss that is down, and only kill one that is up.
const BOSS_ENGINES=[["bossSpawnClaude","claude"],["bossSpawnCodex","codex"],["bossSpawnGrok","grok"]];
let bossBusy=false;
function renderBoss(boss){
  const st=document.getElementById("bossState"); if(!st) return;
  const up=!!boss;
  st.textContent = up ? (boss.backend||"boss")+" up" : "down";
  st.className = "boss-state "+(up?"up":"down");
  // Kill only while up; Revive and Spawn only while down. Mutually exclusive by construction,
  // so the UI can never ask for a second Boss.
  document.getElementById("bossKill").disabled = bossBusy || !up;
  document.getElementById("bossRevive").disabled = bossBusy || up;
  BOSS_ENGINES.forEach(([id])=>{ document.getElementById(id).disabled = bossBusy || up; });
}
function bossMsg(t,bad){
  const m=document.getElementById("bossMsg"); if(!m) return;
  m.textContent=t||""; m.style.color = bad ? "var(--danger)" : "var(--muted-dark)";
}
const BOSS_CONFIRM={
  kill:   "Kill the Boss? It will STAY DOWN — no auto-respawn — until you bring one back from here.",
  revive: "Revive the Boss? Same Boss, resuming its session and memory.",
  spawn:  b=>"Spawn a NEW "+b+" Boss? This starts fresh — it does not keep the old Boss's memory.",
};
const BOSS_PENDING={kill:"killing…", revive:"reviving…", spawn:b=>"spawning "+b+"…"};
const BOSS_DONE={
  kill:   "kill queued — Boss will stay down",
  revive: "revive queued — same Boss coming back",
  spawn:  b=>"spawn queued — new "+b+" Boss coming up",
};
const bossText=(m,a,b)=> typeof m[a]==="function" ? m[a](b) : m[a];
async function bossOp(action, backend){
  if(bossBusy) return;
  if(!confirm(bossText(BOSS_CONFIRM,action,backend))) return;
  bossBusy=true; renderBoss(null); bossMsg(bossText(BOSS_PENDING,action,backend));
  try{
    const r=await api("/todo/boss",{method:"POST",body:JSON.stringify({action:action,backend:backend})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok) bossMsg((d.detail||d.error||("http "+r.status)),true);
    else bossMsg(bossText(BOSS_DONE,action,backend));
  }catch(e){ bossMsg(String(e),true); }
  bossBusy=false;
  loadAgents();
}
function fetchBoard(force){
  if(boardFetchInFlight) return boardFetchInFlight;
  boardFetchInFlight=(async()=>{
   const myReq=++boardReq;
   try{
    const r=await api("/todo/board"); if(!r.ok) return; const b=await r.json();
    if(myReq!==boardReq) return;   // a newer fetchBoard was started after us — its snapshot is >= ours; drop this stale one so it can't wipe a just-posted comment
    const sig=JSON.stringify({o:b.order,p:b.pinSeq,t:Object.entries(b.tasks).map(([k,v])=>[k,v.state,v.pinned,v.pinRank,v.unread,v.verified,v.assignee,v.text,(v.comments||[]).length,(v.proofs||[]).length])});
    BOARD=b;
    if(sig!==boardSig || force){ boardSig=sig; render(); }
    if(openTaskId && BOARD.tasks[openTaskId]) renderModal(BOARD.tasks[openTaskId], false);
    const deep=new URL(location.href).searchParams.get("task");
    if(deep&&!openTaskId&&BOARD.tasks[deep]) openCard(deep,true);
   }catch(e){}
  })().finally(()=>{ boardFetchInFlight=null; });
  return boardFetchInFlight;
}

}

async function healthWatch(){

  document.getElementById("bossKill").addEventListener("click",()=>bossOp("kill"));
