# MyPlow tmux.conf — PLOW/Dracula status plus functional agent TUI fixes
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'dracula/tmux'
set -g @dracula-plugins "cpu-usage ram-usage time"
set -g @dracula-show-powerline false
set -g @dracula-show-left-icon session
set -g @dracula-military-time true
set -g @dracula-day-month false
set -g @dracula-show-timezone false
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 10
set -g automatic-rename off
# UNBIND the default wheel->copy-mode trap (agent TUIs render on the main screen)
unbind -T root WheelUpPane
unbind -T root WheelDownPane
# copy-pipe-AND-CANCEL so a pane never stays stuck in copy-mode
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "cat"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "cat"
run '~/.tmux/plugins/tpm/tpm'
