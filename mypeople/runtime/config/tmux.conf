# MyPlow tmux.conf — PLOW/Dracula status plus functional agent TUI fixes
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'dracula/tmux'
set -g @dracula-plugins "cpu-usage ram-usage time"
set -g @dracula-show-powerline false
set -g @dracula-show-left-icon session
set -g @dracula-military-time true
set -g @dracula-day-month false
set -g @dracula-show-timezone false
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 10
set -g automatic-rename off
# UNBIND the default wheel->copy-mode trap (agent TUIs render on the main screen)
unbind -T root WheelUpPane
unbind -T root WheelDownPane
# copy-pipe-AND-CANCEL so a pane never stays stuck in copy-mode
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "cat"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "cat"
# tmux 3.7b/c squash session groups in the tree by testing the newest session instead of each one, so
# while a web viewer (ttyd-attach.sh) is the newest session `prefix w` and `prefix s` draw a blank screen
# on every other session. -G skips that code; the filter does what the squash was for: one session per
# group, the client's own when it is in that group, and never another connection's viewer.
%hidden TREE_FILTER="##{||:##{==:##{session_name},#{session_name}},##{&&:##{!:##{m:_v_*,##{session_name}}},##{||:##{==:#{session_group},},##{!=:##{session_group},#{session_group}}}}}"
bind -T prefix w run-shell -C "choose-tree -ZwG -f '$TREE_FILTER'"
bind -T prefix s run-shell -C "choose-tree -ZsG -f '$TREE_FILTER'"
run '~/.tmux/plugins/tpm/tpm'
