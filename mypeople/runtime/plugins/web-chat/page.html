<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plow</title>
<style>
:root{--blue:#0A84FF;--gray:#E9E9EB;--muted:#8a8a8e;--ios:-apple-system,"SF Pro Text",BlinkMacSystemFont,system-ui,sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:#F5F5F7;font-family:var(--ios);display:grid;place-items:center;-webkit-font-smoothing:antialiased}
.phone{height:min(800px,calc(100dvh - 40px));aspect-ratio:340/700;border-radius:52px;background:#1c1c1e;padding:10px;position:relative;
  box-shadow:0 0 0 1.5px #3a3a3c inset,0 50px 90px -50px rgba(0,0,0,.45)}
.screen{height:100%;border-radius:42px;background:#fff;overflow:hidden;display:flex;flex-direction:column;position:relative}
.screen::before{content:"";position:absolute;inset:0 0 auto;height:160px;background:linear-gradient(180deg,#EEEEF2 0%,rgba(255,255,255,0) 100%);pointer-events:none}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:90px;height:27px;border-radius:20px;background:#000;z-index:2}
.status{display:flex;justify-content:space-between;align-items:center;padding:14px 24px 0 30px;height:50px;font:600 15px/1 var(--ios);letter-spacing:-.01em;position:relative}
.status svg{height:11px;width:auto}.status .icons{display:flex;gap:5px;align-items:center}
.glass{background:rgba(255,255,255,.8);-webkit-backdrop-filter:blur(16px) saturate(1.8);backdrop-filter:blur(16px) saturate(1.8);
  box-shadow:0 0 0 .5px rgba(0,0,0,.07),0 6px 16px -8px rgba(0,0,0,.2),inset 0 1px 1px rgba(255,255,255,.95)}
.chat-head{display:grid;grid-template-columns:38px minmax(0,1fr) 38px;align-items:start;padding:2px 12px 4px;position:relative}
.round{width:38px;height:38px;margin-top:6px;border-radius:50%;display:grid;place-items:center;color:#111}
.round svg{width:19px;height:19px}.round .back{width:10px;height:17px;margin-right:2px}
.contact{display:grid;justify-items:center}.contact img{width:50px;height:50px;border-radius:50%}
.pill{margin-top:-7px;display:flex;align-items:center;gap:4px;padding:7px 11px 7px 13px;border-radius:999px;font:600 14px/1 var(--ios);letter-spacing:-.01em;color:#111}
.pill svg{width:6px;height:10px;color:#8a8a8e}
.thread{flex:1;overflow-y:auto;padding:6px 14px 12px;display:flex;flex-direction:column;gap:3px;position:relative;overscroll-behavior:contain}
.enc{align-self:center;text-align:center;font:400 11px/1.4 var(--ios);color:var(--muted);margin:0 0 2px}
.stamp{align-self:center;font:500 11px/1 var(--ios);color:var(--muted);margin:6px 0 8px}.stamp b{font-weight:600}
.hint{align-self:center;text-align:center;max-width:80%;font:400 13px/1.4 var(--ios);color:var(--muted);margin:auto 0}
.b{max-width:78%;padding:7px 12px;border-radius:18px;font:400 15px/1.34 var(--ios);letter-spacing:-.01em;position:relative;white-space:pre-wrap;overflow-wrap:anywhere}
.b.me{align-self:flex-end;background:var(--blue);color:#fff}.b.them{align-self:flex-start;background:var(--gray);color:#000}
.b.me+.b.them,.b.them+.b.me,.read+.b,.card+.b{margin-top:8px}
.b a{color:inherit}
.b.tail::before{content:"";position:absolute;bottom:0;height:18px;width:18px}.b.tail::after{content:"";position:absolute;bottom:0;width:10px;height:18px;background:#fff}
.b.tail.me::before{right:-6px;background:var(--blue);border-bottom-left-radius:14px 12px}.b.tail.me::after{right:-10px;border-bottom-left-radius:10px}
.b.tail.them::before{left:-6px;background:var(--gray);border-bottom-right-radius:14px 12px}.b.tail.them::after{left:-10px;border-bottom-right-radius:10px}
.read{align-self:flex-end;font:500 11px/1 var(--ios);color:var(--muted);margin:3px 4px 0 0}
.read.failed{color:#d70015;cursor:pointer}.b.pending{opacity:.6}
.b,.card,.typing{animation:pop .3s cubic-bezier(.2,.9,.3,1.2) both}@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.b,.card,.typing{animation:none}}
.round.close{cursor:pointer;border:0;padding:0;font:inherit}.round.close:focus-visible{outline:2px solid #111;outline-offset:2px}
.chat-head .ghost{visibility:hidden}
.typing{align-self:flex-start;background:var(--gray);border-radius:18px;padding:11px 13px;display:flex;gap:4px;margin-top:8px}
.typing i{width:8px;height:8px;border-radius:50%;background:#8e8e93;animation:blink 1.2s infinite}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.35}30%{opacity:1}}
.card{align-self:flex-start;display:flex;align-items:center;gap:10px;background:var(--gray);border-radius:18px;padding:9px 14px 9px 9px;margin-top:3px;
  font:600 15px/1.2 var(--ios);color:#000;text-decoration:none}
.card .wa{width:38px;height:38px;border-radius:50%;background:#25D366;display:grid;place-items:center}.card .wa svg{width:22px;height:22px}
.card small{display:block;font:400 12.5px/1.3 var(--ios);color:#6c6c70}.card .chev{width:8px;height:13px;margin-left:6px;color:#9a9aa0}
.err{margin:0 16px 4px;font:400 12px/1.3 var(--ios);color:#d70015;text-align:center}
.composer{display:flex;align-items:flex-end;gap:8px;padding:8px 12px 30px;position:relative}
.plus{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#111;font:300 24px/1 var(--ios)}
.field{flex:1;min-width:0;min-height:36px;border-radius:18px;display:flex;align-items:flex-end;padding:0 3px 0 14px}
.field textarea{flex:1;min-width:0;border:0;background:transparent;font:400 16px/20px var(--ios);color:#000;outline:none;resize:none;padding:8px 0;height:36px;max-height:100px;overflow-y:auto}
.field textarea::placeholder{color:#a0a0a5}
.csend{flex:none;width:30px;height:30px;margin:3px 0;border:0;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;cursor:pointer;transform:scale(0);transition:transform .16s}
.csend svg{width:14px;height:14px}.composer.has .csend{transform:none}.csend:focus-visible{outline:2px solid #111;outline-offset:2px}
@media (max-width:520px){body{display:block;background:#fff}.phone{height:100dvh;width:100%;aspect-ratio:auto;border-radius:0;padding:0;box-shadow:none;background:#fff}
  .screen{border-radius:0}.island,.status{display:none}.chat-head{padding-top:max(8px,env(safe-area-inset-top))}.composer{padding-bottom:max(12px,env(safe-area-inset-bottom))}}
</style></head>

<script>
const API = location.pathname.replace(/\/(chat\/?)?$/, '');
const KEY = 'plow-web-token';
const slug = (new URLSearchParams(location.search).get('agent') || '').toLowerCase().replace(/[^a-z0-9-]/g, '').slice(0, 40) || null;
const $ = (id) => document.getElementById(id);
const log = $('log'), typing = $('typing'), err = $('err'), input = $('t'), form = $('f');
const seen = new Map(); // message id -> its bubble
const pending = new Map(); // text -> your bubble already on screen, until the relay gives it an id (its echo can come first)
let token = null, events = null, statusEl = null, waitTimer = null, mine = false, sending = false;
try { token = localStorage.getItem(KEY); } catch {}
const auth = () => (token ? { authorization: 'Bearer ' + token } : {});
const time = (d) => new Date(d).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
const tick = () => { $('clock').textContent = time(Date.now()).replace(/\s?[AP]M$/i, ''); };
$('today').textContent = time(Date.now()); tick(); setInterval(tick, 30000);
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
const up = (msg) => { try { parent.postMessage(msg, location.origin); } catch {} }; // the landing page around this chat
const IM = '<span class="wa" style="background:#34C759"><svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M12 3C6.5 3 2 6.6 2 11.1c0 2.6 1.5 4.9 3.8 6.4-.2 1.3-.9 2.6-2 3.5 2.2 0 4.1-.8 5.4-2 .9.2 1.8.3 2.8.3 5.5 0 10-3.6 10-8.1S17.5 3 12 3Z"/></svg></span>';
const WA = '<span class="wa"><svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .5l-.4.6-.4.5c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.2.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l2 .9c.3.1.5.2.5.3.1.2.1.7-.1 1.3Z"/></svg></span>';

// What the composer types while it waits: Daniel's own asks from agents-one-text, the page's own ask first.
const ASKS = {
  'restaurant-support': "Answer my restaurant's customer messages: hours, menu and reservations.",
};
const ideas = [...(ASKS[slug] ? [ASKS[slug]] : []),
  'Text me the top Hacker News stories every morning at 8.',
  'Match my receipts to my card charges and text me when one is missing.',
  'Text me before it rains when I usually bike home.',
  'Every Sunday night, text me a grocery list for the week.'];

function linkify(node, text) {
  const cards = [];
  for (const piece of text.split(/(https?:\/\/[^\s<>"]+|sms:[^\s<>"]+)/)) {
    if (!/^(https?:\/\/|sms:)/.test(piece)) { bold(node, piece); continue; }
    if (piece.startsWith('https://wa.me/') || piece.startsWith('sms:')) { cards.push(piece); continue; } // a card under the bubble
    const a = document.createElement('a'); a.href = piece; a.target = '_blank'; a.rel = 'noopener'; a.textContent = piece;
    node.append(a);
  }
  return cards;
}
function bold(node, text) { // **this** in an agent's reply reads as bold, never as asterisks
  text.split(/\*\*([^*\n]+)\*\*/).forEach((part, i) => node.append(i % 2 ? Object.assign(document.createElement('strong'), { textContent: part }) : part));
}
function card(url) {
  const a = document.createElement('a'); a.className = 'card'; a.href = url; a.rel = 'noopener';
  const sms = url.startsWith('sms:');
  if (!sms) a.target = '_blank';
  a.innerHTML = (sms ? IM + '<span>Continue on iMessage<small>Opens Messages. Just tap Send.</small></span>' : WA + '<span>Connect WhatsApp<small>Opens WhatsApp. Just tap Send.</small></span>')
    + '<svg class="chev" viewBox="0 0 8 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m1.5 1.5 5 5-5 5"/></svg>';
  return a;
}
// One status line under your latest message, as in Messages: Delivered, then Read when Plow has seen it (its 👀).
function status(bubble, text, failed = false) {
  statusEl = statusEl || Object.assign(document.createElement('div'), { className: 'read' });
  statusEl.textContent = text;
  statusEl.classList.toggle('failed', failed);
  bubble.after(statusEl);
}
function bubble(text, isMine) {
  const b = document.createElement('div'); b.className = 'b tail ' + (isMine ? 'me' : 'them');
  const cards = linkify(b, text.replace(/\n+$/, ''));
  const prev = typing.previousElementSibling;
  if (prev?.classList.contains('b') && prev.classList.contains(isMine ? 'me' : 'them')) prev.classList.remove('tail'); // one tail per run
  if (b.textContent.trim()) log.insertBefore(b, typing);
  for (const url of cards) log.insertBefore(card(url), typing);
  return b;
}
// Plow is typing from the moment it has your message until its answer lands (it answers in seconds, not instantly).
function waiting(on) {
  clearTimeout(waitTimer);
  typing.hidden = !on;
  if (on) { log.appendChild(typing); waitTimer = setTimeout(() => (typing.hidden = true), 90000); }
  scroll();
}
const scroll = () => log.scrollTo({ top: log.scrollHeight, behavior: still ? 'auto' : 'smooth' });
function render(m) {
  if (m.mine && !seen.has(m.id) && pending.has(m.text)) { seen.set(m.id, pending.get(m.text)); pending.delete(m.text); }
  if (seen.has(m.id)) { if (m.mine && m.reactions.length) status(seen.get(m.id), 'Read ' + time(Date.now())); return; }
  const b = bubble(m.text, m.mine);
  for (const f of m.files) {
    const a = document.createElement('a'); a.href = f.url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = (b.textContent ? '\n' : '') + '📎 ' + f.name;
    b.append(a);
  }
  seen.set(m.id, b);
  if (m.mine) status(b, m.reactions.length ? 'Read ' + time(m.created_at) : 'Delivered');
  else waiting(false);
  scroll();
}
async function refill() {
  const r = await fetch(API + '/messages', { headers: auth() });
  if (r.status === 401) { token = null; try { localStorage.removeItem(KEY); } catch {} return; }
  if (!r.ok) return;
  const msgs = (await r.json()).messages;
  msgs.forEach(render);
  if (msgs.length) { stopIdeas(); if (msgs.at(-1).mine) waiting(true); } // back mid-conversation: Plow still owes an answer
}
function listen() {
  events?.close();
  events = new EventSource(API + '/events?token=' + encodeURIComponent(token));
  events.addEventListener('message', (e) => render(JSON.parse(e.data)));
  events.addEventListener('typing', (e) => waiting(JSON.parse(e.data).on));
  events.addEventListener('reaction', (e) => { const d = JSON.parse(e.data); if (seen.has(d.message_id) && d.emoji) status(seen.get(d.message_id), 'Read ' + time(Date.now())); });
  events.onopen = refill; // after a drop, catch up on what came meanwhile
}

// The composer types an ask, deletes it and types the next, until you tap it (then it's yours) or send what it shows.
let ideaRun = 0, shown = ''; // shown: the whole ask the composer is typing (send sends all of it, not the half typed)
function stopIdeas() { ideaRun++; mine = true; shown = ''; }
async function playIdeas() {
  const run = ++ideaRun, wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const show = (t) => { if (run === ideaRun) { input.value = t; fit(); } };
  if (still) { shown = ideas[0]; return show(ideas[0]); }
  await wait(900);
  for (let i = 0; run === ideaRun; i = (i + 1) % ideas.length) {
    const text = ideas[i];
    shown = text;
    for (let n = 1; n <= text.length && run === ideaRun; n++) { show(text.slice(0, n)); await wait(28 + Math.random() * 40); }
    await wait(2600);
    for (let n = text.length; n >= 0 && run === ideaRun; n -= 3) { show(text.slice(0, n)); await wait(12); }
    await wait(400);
  }
}
// The field grows with what it holds, up to 100px, like Messages; return sends (shift+return is a new line).
function fit() { input.style.height = '36px'; input.style.height = Math.min(input.scrollHeight, 100) + 'px'; form.classList.toggle('has', !!input.value.trim()); }
const clear = () => { input.value = ''; fit(); };
input.addEventListener('pointerdown', () => { if (!mine) { stopIdeas(); clear(); } });
input.addEventListener('focus', () => { if (!mine) { stopIdeas(); clear(); } up({ type: 'plow-chat-focus' }); });
input.addEventListener('input', fit);
input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); } });

async function send(text, b) {
  sending = true;
  try {
    const r = await fetch(API + '/messages', { method: 'POST', headers: { 'content-type': 'application/json', ...auth() },
      body: JSON.stringify(token ? { text } : { text, ...(slug ? { page: slug } : {}) }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error?.message || 'Not Delivered');
    if (j.token) { token = j.token; try { localStorage.setItem(KEY, token); } catch {} listen(); }
    b.classList.remove('pending');
    pending.delete(text);
    seen.set(j.message.id, b);
    if (statusEl?.previousElementSibling === b && !/^Read/.test(statusEl.textContent)) status(b, 'Delivered');
    if (!/^Read/.test(statusEl?.textContent || '')) waiting(true);
  } catch (e) {
    status(b, (e.message && e.message !== 'Failed to fetch' ? e.message : 'Not Delivered') + ' · Tap to try again', true);
    statusEl.onclick = () => { statusEl.onclick = null; statusEl.classList.remove('failed'); b.classList.add('pending'); status(b, 'Sending…'); send(text, b); };
  } finally { sending = false; }
}
form.addEventListener('submit', (e) => {
  e.preventDefault();
  const text = (!mine && shown ? shown : input.value).trim();
  if (!text || sending) return;
  stopIdeas();
  clear(); err.textContent = '';
  const b = bubble(text, true); // on screen at once, as in Messages; it is confirmed (or offered again) below
  b.classList.add('pending');
  pending.set(text, b);
  status(b, 'Sending…');
  scroll();
  send(text, b);
  if (matchMedia('(pointer: fine)').matches) input.focus();
});

// Inside the landing page on a phone, the chat opens full screen; its back chevron closes it.
addEventListener('message', (e) => {
  if (e.origin !== location.origin) return;
  if (e.data?.type === 'plow-chat-open') $('close').classList.remove('ghost');
  if (e.data?.type === 'plow-chat-closed') $('close').classList.add('ghost');
  if (e.data?.type === 'plow-chat-type') { stopIdeas(); clear(); input.focus(); }
});
$('close').addEventListener('click', () => { input.blur(); up({ type: 'plow-chat-close' }); });

bubble('What do you want an agent to do for you?', false).classList.add('greet');
if (token) refill().then(() => { if (!mine) playIdeas(); token && listen(); });
else playIdeas();
</script></body></html>
