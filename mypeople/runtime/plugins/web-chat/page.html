<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Plow</title>
<style>
/* iMessage on iOS 26, measured from Daniel's own thread with Willow (IMG_7426, iPhone, dark): glass header and composer
   floating over the thread, 17pt bubbles, the 👀 tapback on the corner, Delivered under it. Light or dark follows the
   phone, as Messages does. */
:root{--bg:#fff;--them:#E9E9EB;--them-fg:#000;--me:#0A84FF;--muted:#8A8A8E;--icon:#111;--glass:rgba(250,250,252,.72);
  --glass-line:rgba(0,0,0,.08);--glass-hi:rgba(255,255,255,.9);--veil:rgba(255,255,255,.35);--chip:#E5E5EA;--chip-fg:#000;
  --ios:-apple-system,"SF Pro Text",BlinkMacSystemFont,system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#000;--them:#262628;--them-fg:#fff;--me:#0A84FF;--muted:#8E8E93;--icon:#fff;
  --glass:rgba(38,38,40,.66);--glass-line:rgba(255,255,255,.12);--glass-hi:rgba(255,255,255,.16);--veil:rgba(0,0,0,.4);--chip:#EBEBF0;--chip-fg:#000}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);overscroll-behavior:none}
body{font-family:var(--ios);-webkit-font-smoothing:antialiased;color:var(--them-fg);overflow:hidden}
/* The screen is what Safari shows: with the keyboard up it shrinks to the visible part (chat.js follows visualViewport),
   so the header and thread stay put and the composer sits on the keyboard. */
.screen{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100%);background:var(--bg);overflow:hidden}
.kb .composer{bottom:8px}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);
  box-shadow:inset 0 .5px 0 var(--glass-hi),0 0 0 .5px var(--glass-line),0 8px 24px -14px rgba(0,0,0,.35)}

/* The phone's own status bar, only when the page draws a phone around the chat (desktop). */
.status{display:none;position:absolute;z-index:6;inset:0 0 auto;height:54px;padding:18px 30px 0 34px;justify-content:space-between;
  align-items:center;font:600 17px/1 var(--ios);letter-spacing:-.02em;color:var(--icon);pointer-events:none}
.status svg{height:12px;width:auto;fill:currentColor}.status .icons{display:flex;gap:6px;align-items:center}
.framed .status{display:flex}

/* Scroll edges: the thread fades out under the header (solid behind it: no bubble shows through) and the composer. */
.edge{position:absolute;z-index:4;left:0;right:0;pointer-events:none}
.edge.top{top:0;height:calc(var(--head) + 26px);background:linear-gradient(var(--bg) calc(100% - 40px),transparent)}
.edge.bottom{-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.edge.bottom{bottom:0;height:96px;background:linear-gradient(transparent,color-mix(in srgb,var(--bg) 80%,transparent) 60%,var(--bg));
  -webkit-mask-image:linear-gradient(transparent,#000 45%);mask-image:linear-gradient(transparent,#000 45%)}

/* Header: back, the contact (round avatar over a name pill), video. */
.head{--top:6px;position:absolute;z-index:5;inset:0 0 auto;padding:var(--top) 16px 0;display:grid;grid-template-columns:44px 1fr 44px;align-items:start;pointer-events:none}
.framed .head{--top:60px}
.circle{pointer-events:auto;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--icon);border:0;padding:0;font:inherit}
.circle svg{fill:none;stroke:currentColor}
.back svg{width:12px;height:21px;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;margin-right:2px}
.video svg{width:27px;height:18px;stroke-width:1.9;stroke-linejoin:round}
button.back{cursor:pointer}button.back:focus-visible{outline:2px solid var(--me);outline-offset:2px}
.who{display:grid;justify-items:center;pointer-events:auto}
.who img{width:60px;height:60px;border-radius:50%;display:block}
.name{margin-top:-6px;display:flex;align-items:center;gap:5px;height:26px;padding:0 9px 0 12px;border-radius:13px;
  font:600 17px/1 var(--ios);letter-spacing:-.02em;color:var(--icon)}
.name svg{width:6px;height:11px;stroke:var(--muted);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* The thread scrolls under both bars. */
.thread{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:calc(var(--head) + 12px) 16px 92px;
  display:flex;flex-direction:column;gap:3px;--head:126px}
.framed .thread{--head:180px}
.framed .edge.top{--head:180px}.edge.top{--head:126px}
.stamp{align-self:center;font:500 13px/1 var(--ios);color:var(--muted);margin:8px 0 10px;letter-spacing:-.01em}
.b{position:relative;max-width:min(271px,74%);padding:9px 14px 10px;border-radius:19px;font:400 17px/21px var(--ios);
  letter-spacing:-.02em;white-space:pre-wrap;overflow-wrap:anywhere;touch-action:manipulation;-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;cursor:default}
.b.me{align-self:flex-end;background:var(--me);color:#fff}.b.them{align-self:flex-start;background:var(--them);color:var(--them-fg)}
.b.me+.b.them,.b.them+.b.me,.read+.b,.card+.b,.typing+.b,.b+.typing{margin-top:10px}
.thread .b.b.has-tb{margin-top:36px} /* beats the 10px side-switch gap: the badge needs the room, as in his shot */
.b a{color:inherit}
.b.tail::before{content:"";position:absolute;bottom:0;height:20px;width:20px}.b.tail::after{content:"";position:absolute;bottom:0;width:10px;height:20px;background:var(--bg)}
.b.tail.me::before{right:-7px;background:var(--me);border-bottom-left-radius:16px 14px}.b.tail.me::after{right:-10px;border-bottom-left-radius:10px}
.b.tail.them::before{left:-7px;background:var(--them);border-bottom-right-radius:16px 14px}.b.tail.them::after{left:-10px;border-bottom-right-radius:10px}
.b.pending{opacity:.6}
.read{align-self:flex-end;font:600 12.5px/1 var(--ios);color:var(--muted);margin:5px 20px 0 0;letter-spacing:-.01em}
.read.failed{color:#FF453A;cursor:pointer}

/* Tapbacks: a round badge on the bubble's top corner with two little dots, as in his 👀. Theirs on yours: their gray, top-left.
   Yours on theirs: your blue, top-right. A ring in the background color cuts it out of the bubble. */
.tb{position:absolute;top:-27px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:19px;line-height:1;
  box-shadow:0 0 0 2.5px var(--bg);pointer-events:none;animation:tb .35s cubic-bezier(.2,1.4,.4,1) both}
.tb::before,.tb::after{content:"";position:absolute;border-radius:50%;background:inherit;box-shadow:0 0 0 2px var(--bg)}
.tb::before{width:10px;height:10px;top:27px}.tb::after{width:5px;height:5px;top:37px}
.me>.tb{left:-14px;background:var(--them)}.me>.tb::before{left:2px}.me>.tb::after{left:-4px}
.them>.tb{right:-14px;background:var(--me)}.them>.tb::before{right:2px}.them>.tb::after{right:-4px}
@keyframes tb{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}

.typing{align-self:flex-start;background:var(--them);border-radius:19px;padding:12px 14px;display:flex;gap:5px}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.35}30%{opacity:1}}
.card{align-self:flex-start;display:flex;align-items:center;gap:10px;background:var(--them);border-radius:19px;padding:9px 14px 9px 9px;margin-top:3px;
  font:600 16px/1.2 var(--ios);color:var(--them-fg);text-decoration:none}
.card .wa{width:38px;height:38px;border-radius:50%;background:#25D366;display:grid;place-items:center}.card .wa svg{width:22px;height:22px}
.card small{display:block;font:400 13px/1.3 var(--ios);color:var(--muted)}.card .chev{width:8px;height:13px;margin-left:6px;color:var(--muted)}
.b,.card,.typing{animation:pop .3s cubic-bezier(.2,.9,.3,1.2) both}@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.b,.card,.typing,.tb,.picker{animation:none}}

/* Composer: + and the field, floating glass; the mic shows while it is empty, the blue arrow once there is text. */
.composer{position:absolute;z-index:5;left:0;right:0;bottom:max(8px,env(safe-area-inset-bottom));display:flex;align-items:flex-end;gap:14px;padding:0 28px}
.framed .composer{bottom:30px;padding:0 24px}
/* Continue on iMessage, pinned over the composer once the thread has the link: it never scrolls out of view. */
.pin{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;white-space:nowrap;
  padding:6px 16px 6px 6px;border-radius:999px;font:600 15px/1 var(--ios);color:var(--them-fg);text-decoration:none}
.pin[hidden]{display:none}.pin .wa{width:30px;height:30px;border-radius:50%;display:grid;place-items:center}.pin .wa svg{width:18px;height:18px}
.pinned .thread{padding-bottom:150px}
.plus{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--icon)}
.plus svg{width:17px;height:17px;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.field{flex:1;min-width:0;min-height:38px;border-radius:19px;display:flex;align-items:flex-end;padding:0 4px 0 15px}
.field textarea{flex:1;min-width:0;border:0;background:transparent;font:400 17px/21px var(--ios);letter-spacing:-.02em;color:var(--them-fg);outline:none;resize:none;
  padding:8.5px 0;height:38px;max-height:110px;overflow-y:auto;-webkit-user-select:text;user-select:text}
.field textarea::placeholder{color:var(--muted)}
.mic{flex:none;width:30px;height:30px;margin:4px 2px;display:grid;place-items:center;color:var(--muted)}
.mic svg{width:15px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.csend{flex:none;width:30px;height:30px;margin:4px 0;border:0;border-radius:50%;background:var(--me);color:#fff;display:none;place-items:center;cursor:pointer}
.csend svg{width:14px;height:14px}.composer.has .csend{display:grid}.composer.has .mic{display:none}
.csend:focus-visible{outline:2px solid var(--me);outline-offset:2px}
.err{position:absolute;z-index:5;left:16px;right:16px;bottom:58px;margin:0;font:400 12px/1.3 var(--ios);color:#FF453A;text-align:center}

/* Tapback picker: hold or double-tap a bubble. The rest of the chat dims under a blur; the six sit in a glass capsule. */
.veil{position:absolute;z-index:20;inset:0;background:var(--veil);-webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);animation:fade .18s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.b.lifted{z-index:21}
.picker{position:absolute;z-index:22;display:flex;gap:2px;padding:5px;border-radius:26px;animation:pick .28s cubic-bezier(.2,1.3,.4,1) both;transform-origin:var(--ox,50%) 100%}
@keyframes pick{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.picker button{width:42px;height:42px;border:0;border-radius:50%;background:transparent;font-size:23px;line-height:1;display:grid;place-items:center;cursor:pointer;padding:0}
.picker button[aria-pressed=true]{background:var(--me)}
.picker button:focus-visible{outline:2px solid var(--me);outline-offset:1px}
</style>
<script>
// PostHog, project [Prod] Plow (Plow Collective): named bya_* events only. Autocapture, heatmaps and recordings stay
// off, so no chat text or phone number reaches it. An agent's own page (?agent=) isn't tracked. ?test=1, or a first
// message that starts with TEST, marks the visitor a test (the dashboard leaves tests out).
if (!/[?&]agent=/.test(location.search)) {
  !function(t,e){var o,n,p,r;e.__SV||(window.posthog=e,e._i=[],e.init=function(i,s,a){function g(t,e){var o=e.split('.');2==o.length&&(t=t[o[0]],e=o[1]),t[e]=function(){t.push([e].concat(Array.prototype.slice.call(arguments,0)))}}(p=t.createElement('script')).type='text/javascript',p.async=!0,p.src=s.api_host+'/static/array.js',(r=t.getElementsByTagName('script')[0]).parentNode.insertBefore(p,r);var u=e;for(void 0!==a?u=e[a]=[]:a='posthog',u.people=u.people||[],u.toString=function(t){var e='posthog';return'posthog'!==a&&(e+='.'+a),t||(e+=' (stub)'),e},u.people.toString=function(){return u.toString(1)+'.people (stub)'},o='init capture register register_once unregister opt_in_capturing opt_out_capturing has_opted_in_capturing has_opted_out_capturing identify alias people.set people.set_once set_config reset get_config get_property getFeatureFlag getFeatureFlagPayload isFeatureEnabled onFeatureFlags reloadFeatureFlags updateEarlyAccessFeatureEnrollment getEarlyAccessFeatures getBootstrapData'.split(' '),n=0;n<o.length;n++)g(u,o[n]);e._i.push([i,s,a])},e.__SV=1)}(document,window.posthog||[]);
  posthog.init('phc_qFo7YgHhtfN2emBq7qxTGxi2xpsTg8xATkUDJNPaTkQY', { api_host: 'https://us.i.posthog.com', capture_pageview: !/[?&]frame=1\b/.test(location.search), autocapture: false, rageclick: false,
    capture_dead_clicks: false, enable_heatmaps: false, disable_session_recording: true });
  posthog.register({ site: 'build_an_agent', page_version: 'default', ...(/[?&]test=1\b/.test(location.search) && { test: true }) });
}
// The chat engine calls these: asked = when the first message went (until Plow's first reply), heard() on each live reply.
let asked = 0;
const track = (event, props) => window.posthog?.capture(event, props);
const heard = (text) => {
  if (asked) { track('bya_agent_replied', { seconds_to_reply: Math.round((Date.now() - asked) / 1000) }); asked = 0; }
  if (/sms:/.test(text)) track('bya_handover_shown');
};
document.addEventListener('click', (e) => { if (e.target.closest?.('a[href^="sms:"]')) track('bya_handover_clicked'); });
</script>
</head>

    const a = document.createElement('a'); a.href = piece; a.target = '_blank'; a.rel = 'noopener'; a.textContent = piece;
    node.append(a);
  }
  return cards;
}
function bold(node, text) { // **this** in an agent's reply reads as bold, never as asterisks
  text.split(/\*\*([^*\n]+)\*\*/).forEach((part, i) => node.append(i % 2 ? Object.assign(document.createElement('strong'), { textContent: part }) : part));
}
function card(url) {
  const a = document.createElement('a'); a.className = 'card'; a.href = url; a.rel = 'noopener';
  const sms = url.startsWith('sms:');
  if (!sms) a.target = '_blank';
  a.innerHTML = (sms ? IM + '<span>Continue on iMessage<small>Opens Messages. Just tap Send.</small></span>' : WA + '<span>Connect WhatsApp<small>Opens WhatsApp. Just tap Send.</small></span>')
    + '<svg class="chev" viewBox="0 0 8 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m1.5 1.5 5 5-5 5"/></svg>';
  return a;
}
function pin(url) {
  const p = $('pin');
  p.href = url; p.innerHTML = IM + 'Continue on iMessage'; p.hidden = false;
  screen.classList.add('pinned');
}
// One status line under your latest message, as in Messages.
function status(bubble, text, failed = false) {
  statusEl = statusEl || Object.assign(document.createElement('div'), { className: 'read' });
  statusEl.textContent = text;
  statusEl.classList.toggle('failed', failed);
  bubble.after(statusEl);
}
// The tapback on a bubble: on yours, the agent's (its 👀 too); on the agent's, yours.
function badge(b, emoji) {
  b.querySelector(':scope > .tb')?.remove();
  b.classList.toggle('has-tb', !!emoji);
  if (!emoji) return;
  const t = document.createElement('span'); t.className = 'tb'; t.textContent = emoji; t.setAttribute('aria-label', 'Tapback ' + emoji);
  b.append(t);
}
function bubble(text, isMine) {
  const b = document.createElement('div'); b.className = 'b tail ' + (isMine ? 'me' : 'them');
  const cards = linkify(b, text.replace(/\n+$/, ''));
  const prev = typing.previousElementSibling;
  if (prev?.classList.contains('b') && prev.classList.contains(isMine ? 'me' : 'them')) prev.classList.remove('tail'); // one tail per run
  if (b.textContent.trim()) log.insertBefore(b, typing);
  for (const url of cards) {
    log.insertBefore(card(url), typing);
    if (url.startsWith('sms:')) pin(url); // the newest Continue on iMessage also stays pinned over the composer
  }
  return b;
}
// Plow is typing from the moment it has your message until its answer lands (it answers in seconds, not instantly).
function waiting(on) {
  clearTimeout(waitTimer);
  typing.hidden = !on;
  if (on) { log.appendChild(typing); waitTimer = setTimeout(() => (typing.hidden = true), 90000); }
  scroll();
}
const scroll = () => log.scrollTo({ top: log.scrollHeight, behavior: still ? 'auto' : 'smooth' });
function render(m, live = false) {
  if (m.mine && !seen.has(m.id) && pending.has(m.text)) { seen.set(m.id, pending.get(m.text)); pending.delete(m.text); }
  let b = seen.get(m.id);
  if (!b) {
    b = bubble(m.text, m.mine);
    b.dataset.id = m.id;
    for (const f of m.files) {
      const a = document.createElement('a'); a.href = f.url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = (b.textContent ? '\n' : '') + '📎 ' + f.name;
      b.append(a);
    }
    seen.set(m.id, b);
    if (m.mine) status(b, 'Delivered');
    else { waiting(false); if (live) { sfx('received'); heard(m.text); } }
  }
  badge(b, m.mine ? m.reactions[0] : m.tapback);
  scroll();
}
async function refill() {
  const r = await fetch(API + '/messages', { headers: auth() });
  if (r.status === 401) { token = null; try { localStorage.removeItem(KEY); } catch {} return; }
  if (!r.ok) return;
  const msgs = (await r.json()).messages;
  msgs.forEach((m) => render(m));
  if (msgs.length) { stopIdeas(); if (msgs.at(-1).mine) waiting(true); } // back mid-conversation: Plow still owes an answer
}
function listen() {
  events?.close();
  events = new EventSource(API + '/events?token=' + encodeURIComponent(token));
  events.addEventListener('message', (e) => render(JSON.parse(e.data), true));
  events.addEventListener('typing', (e) => waiting(JSON.parse(e.data).on));
  events.addEventListener('reaction', (e) => { const d = JSON.parse(e.data); const b = seen.get(d.message_id); if (b?.classList.contains('me')) badge(b, d.emoji); });
  events.addEventListener('tapback', (e) => { const d = JSON.parse(e.data); const b = seen.get(d.message_id); if (b?.classList.contains('them')) badge(b, d.emoji); });
  events.onopen = refill; // after a drop, catch up on what came meanwhile
}

// --- Tapbacks from you: hold or double-tap a bubble of the agent's, pick one of the six; the same one again takes it back.
let pick = null;
function closePicker() {
  if (!pick) return;
  pick.veil.remove(); pick.bar.remove(); pick.b.classList.remove('lifted');
  pick = null;
}
function openPicker(b) {
  if (pick || !b.dataset.id || !token || !b.classList.contains('them')) return;
  navigator.vibrate?.(8);
  const veil = Object.assign(document.createElement('div'), { className: 'veil' });
  const bar = Object.assign(document.createElement('div'), { className: 'picker glass', role: 'menu' });
  bar.setAttribute('aria-label', 'Tapback');
  const current = b.querySelector(':scope > .tb')?.textContent || '';
  for (const e of TAPBACKS) {
    const btn = Object.assign(document.createElement('button'), { type: 'button', textContent: e });
    btn.setAttribute('role', 'menuitemradio'); btn.setAttribute('aria-pressed', String(e === current)); btn.setAttribute('aria-label', 'Tapback ' + e);
    btn.addEventListener('click', () => react(b, e === current ? '' : e));
    bar.append(btn);
  }
  veil.addEventListener('click', closePicker);
  screen.append(veil, bar);
  b.classList.add('lifted');
  const s = screen.getBoundingClientRect(), r = b.getBoundingClientRect(), w = bar.offsetWidth, h = bar.offsetHeight;
  const left = Math.max(10, Math.min(r.left - s.left - 4, s.width - w - 10));
  const top = r.top - s.top - h - 14 > 70 ? r.top - s.top - h - 14 : r.bottom - s.top + 12;
  Object.assign(bar.style, { left: left + 'px', top: top + 'px' });
  bar.style.setProperty('--ox', (r.left - s.left - left + 30) + 'px');
  pick = { veil, bar, b };
  bar.querySelector('button').focus({ preventScroll: true });
}
async function react(b, emoji) {
  closePicker();
  badge(b, emoji);
  if (emoji) sfx(emoji);
  try {
    const r = await fetch(API + '/react', { method: 'POST', headers: { 'content-type': 'application/json', ...auth() }, body: JSON.stringify({ message: b.dataset.id, emoji }) });
    if (!r.ok) throw new Error();
  } catch { badge(b, ''); err.textContent = 'Tapback not sent. Try again.'; }
}
let pressTimer = null, lastTap = { b: null, at: 0 };
log.addEventListener('pointerdown', (e) => {
  const b = e.target.closest('.b.them');
  if (!b || e.target.closest('a')) return;
  clearTimeout(pressTimer);
  pressTimer = setTimeout(() => openPicker(b), 420);
});
for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) log.addEventListener(ev, () => clearTimeout(pressTimer));
log.addEventListener('scroll', () => clearTimeout(pressTimer), { passive: true });
log.addEventListener('click', (e) => {
  const b = e.target.closest('.b.them');
  if (!b || e.target.closest('a')) return;
  const now = Date.now();
  if (lastTap.b === b && now - lastTap.at < 320) { lastTap = { b: null, at: 0 }; openPicker(b); } else lastTap = { b, at: now };
});
log.addEventListener('contextmenu', (e) => { if (e.target.closest('.b')) e.preventDefault(); });
addEventListener('keydown', (e) => { if (e.key === 'Escape') closePicker(); });

// --- The composer types an ask, deletes it and types the next, until you tap it (then it's yours) or send what it shows.
const ASKS = { 'restaurant-support': "Answer my restaurant's customer messages: hours, menu and reservations." };
const ideas = [...(ASKS[slug] ? [ASKS[slug]] : []),
  'Text me the top Hacker News stories every morning at 8.',
  'Match my receipts to my card charges and text me when one is missing.',
  'Text me before it rains when I usually bike home.',
  'Every Sunday night, text me a grocery list for the week.'];
let ideaRun = 0, shown = ''; // shown: the whole ask the composer is typing (send sends all of it, not the half typed)
function stopIdeas() { ideaRun++; mine = true; shown = ''; }
async function playIdeas() {
  const run = ++ideaRun, wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const show = (t) => { if (run === ideaRun) { input.value = t; fit(); } };
  if (still) { shown = ideas[0]; return show(ideas[0]); }
  await wait(900);
  for (let i = 0; run === ideaRun; i = (i + 1) % ideas.length) {
    const text = ideas[i];
    shown = text;
    for (let n = 1; n <= text.length && run === ideaRun; n++) { show(text.slice(0, n)); await wait(28 + Math.random() * 40); }
    await wait(2600);
    for (let n = text.length; n >= 0 && run === ideaRun; n -= 3) { show(text.slice(0, n)); await wait(12); }
    await wait(400);
  }
}
// The field grows with what it holds, like Messages; return sends (shift+return is a new line).
function fit() { input.style.height = '38px'; input.style.height = Math.min(input.scrollHeight, 110) + 'px'; form.classList.toggle('has', !!input.value.trim()); }
const clear = () => { input.value = ''; fit(); };
// The idea clears once the field has focus, not on touch: a field shrinking under the finger loses the tap on iOS.
input.addEventListener('focus', () => { if (!mine) { stopIdeas(); clear(); } });
input.addEventListener('input', fit);
input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); } });

async function send(text, b, from = 'typed') {
  if (/^TEST/.test(text)) window.posthog?.register({ test: true });
  sending = true;
  try {
    const r = await fetch(API + '/messages', { method: 'POST', headers: { 'content-type': 'application/json', ...auth() },
      body: JSON.stringify(token ? { text } : { text, ...(slug ? { page: slug } : {}) }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error?.message || 'Not Delivered');
    if (j.token) { asked = Date.now(); track('bya_chat_started', { ask: from }); } else track('bya_message_sent');
    if (j.token) { token = j.token; try { localStorage.setItem(KEY, token); } catch {} listen(); }
    b.classList.remove('pending');
    pending.delete(text);
    b.dataset.id = j.message.id;
    seen.set(j.message.id, b);
    if (statusEl?.previousElementSibling === b) status(b, 'Delivered');
    waiting(true);
  } catch (e) {
    status(b, (e.message && e.message !== 'Failed to fetch' ? e.message : 'Not Delivered') + ' · Tap to try again', true);
    statusEl.onclick = () => { statusEl.onclick = null; statusEl.classList.remove('failed'); b.classList.add('pending'); status(b, 'Sending…'); send(text, b); };
  } finally { sending = false; }
}
form.addEventListener('submit', (e) => {
  e.preventDefault();
  const from = !mine && shown ? 'example' : 'typed';
  const text = (!mine && shown ? shown : input.value).trim();
  if (!text || sending) return;
  stopIdeas();
  clear(); err.textContent = '';
  const b = bubble(text, true); // on screen at once, as in Messages; it is confirmed (or offered again) below
  b.classList.add('pending');
  pending.set(text, b);
  status(b, 'Sending…');
  sfx('sent');
  scroll();
  send(text, b, from);
  if (matchMedia('(pointer: fine)').matches) input.focus();
});

// On a phone this is the page itself (the landing sends phones here). The screen follows what Safari shows
// (visualViewport): with the keyboard up the header and thread stay put, the composer sits on the keyboard and the
// latest message stays in view. Its back chevron leads to the rest of the page.
if (window.top === window) {
  const vv = window.visualViewport;
  // Were you reading the latest message? Then it stays in view as the keyboard comes and goes. iOS moves the thread
  // itself while the keyboard animates, so those scrolls don't count, and the end is pinned again once it settles.
  let atEnd = true, moving = 0, settle;
  log.addEventListener('scroll', () => { if (Date.now() > moving) atEnd = log.scrollHeight - log.scrollTop - log.clientHeight < 60; }, { passive: true });
  const toEnd = () => { if (atEnd) log.scrollTop = log.scrollHeight; };
  const follow = () => {
    moving = Date.now() + 600;
    screen.style.setProperty('--vvh', vv.height + 'px');
    screen.style.setProperty('--vvt', vv.offsetTop + 'px');
    screen.classList.toggle('kb', innerHeight - vv.height > 120);
    requestAnimationFrame(toEnd);
    clearTimeout(settle); settle = setTimeout(toEnd, 450);
  };
  if (vv) { vv.addEventListener('resize', follow); vv.addEventListener('scroll', follow); follow(); }
  const page = API + '/?page=1' + (slug ? '&agent=' + slug : '');
  $('close').tabIndex = 0;
  $('close').addEventListener('click', () => {
    if (document.referrer.startsWith(location.origin + API + '/?page')) history.back(); else location.assign(page);
  });
}

bubble('What do you want an agent to do for you?', false).classList.add('greet');
if (token) refill().then(() => { if (!mine) playIdeas(); token && listen(); });
else playIdeas();

</script></body></html>
